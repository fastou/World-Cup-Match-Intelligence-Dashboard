# Add this block inside the existing server { ... } for 3.252.137.211.
# It mounts the dashboard at http://3.252.137.211/worldcup/
# The Node process should listen on 127.0.0.1:4174 with BASE_PATH=/worldcup.

location = /worldcup {
    return 301 /worldcup/;
}

location /worldcup/ {
    proxy_pass http://127.0.0.1:4174/worldcup/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
}

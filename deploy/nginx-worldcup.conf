# Add this block inside every active HTTP/HTTPS server { ... } block that should serve the dashboard.
# On the production host, add it to the port 80 default server and to the port 443 server if browsers may upgrade to HTTPS.
# It mounts the dashboard at /worldcup/.
# The Node process should listen on 127.0.0.1:4174 with BASE_PATH=/worldcup.

location = /worldcup {
    return 301 /worldcup/;
}

location /worldcup/ {
    proxy_pass http://127.0.0.1:4174/worldcup/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
}

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup Match Intelligence Dashboard</title>
    <style>
      :root {
        --bg: #f6f7f2;
        --panel: #ffffff;
        --ink: #18201d;
        --muted: #66706b;
        --line: #d9dfd8;
        --green: #147d64;
        --red: #b83a35;
        --amber: #a26213;
        --blue: #245a9c;
        --shadow: 0 12px 32px rgba(31, 45, 38, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 28px;
        border-bottom: 1px solid var(--line);
        background: rgba(246, 247, 242, 0.94);
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: linear-gradient(135deg, #1f6b54, #d5b86c);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .subhead {
        margin-top: 2px;
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .opportunity-button {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 40px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 760;
      }

      .opportunity-button.live {
        border-color: rgba(20, 125, 100, 0.45);
        background: #e8f2ee;
        color: var(--green);
      }

      .opportunity-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--green);
        color: #fff;
        font-size: 12px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .opportunity-button.empty .opportunity-count {
        background: #c4ccc7;
      }

      .language-toggle {
        display: inline-flex;
        align-items: center;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .language-toggle button {
        min-width: 44px;
        height: 32px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 750;
      }

      .language-toggle button.active {
        background: #e8f2ee;
        color: var(--green);
      }

      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }

      .icon-button:hover {
        border-color: #9fb0a8;
      }

      .opportunity-modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: flex-start;
        justify-content: flex-end;
        padding: 78px 28px 28px;
        background: rgba(20, 28, 24, 0.32);
      }

      .opportunity-modal.open {
        display: flex;
      }

      .opportunity-dialog {
        width: min(760px, 100%);
        max-height: calc(100vh - 110px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(20, 28, 24, 0.22);
      }

      .opportunity-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .opportunity-head h2 {
        margin: 0;
        font-size: 17px;
      }

      .opportunity-tabs {
        display: flex;
        gap: 6px;
        padding: 10px 14px 0;
        background: var(--panel);
      }

      .opportunity-tab {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f7f9f6;
        color: var(--muted);
        cursor: pointer;
        padding: 0 11px;
        font-size: 12px;
        font-weight: 800;
      }

      .opportunity-tab.active {
        border-color: rgba(20, 125, 100, 0.35);
        background: #e8f2ee;
        color: var(--green);
      }

      .opportunity-body {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .opportunity-card {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
        cursor: pointer;
        transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }

      .opportunity-card:hover,
      .opportunity-card:focus-visible {
        border-color: rgba(20, 125, 100, 0.45);
        box-shadow: 0 10px 26px rgba(31, 45, 38, 0.09);
        outline: none;
        transform: translateY(-1px);
      }

      .opportunity-card.checking {
        border-color: rgba(36, 90, 156, 0.5);
      }

      .opportunity-card.checked {
        border-color: rgba(20, 125, 100, 0.48);
      }

      .opportunity-card.observation {
        border-color: rgba(120, 137, 129, 0.32);
        background: #f8faf7;
      }

      .opportunity-card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .opportunity-title {
        font-size: 15px;
        font-weight: 850;
        line-height: 1.3;
      }

      .opportunity-group-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 4px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 850;
      }

      .opportunity-summary {
        margin-top: 6px;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.45;
      }

      .opportunity-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .opportunity-chip {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 7px;
        border-radius: 6px;
        background: #edf0ef;
        color: #59645f;
        font-size: 12px;
        font-weight: 720;
      }

      .opportunity-chip.good {
        background: #e2f3ec;
        color: var(--green);
      }

      .opportunity-chip.warn {
        background: #f7ead1;
        color: #8a5a0a;
      }

      .opportunity-section {
        margin-top: 10px;
      }

      .opportunity-section strong {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
      }

      .opportunity-section ul {
        display: grid;
        gap: 4px;
        margin: 0;
        padding-left: 17px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .opportunity-live-check {
        display: grid;
        gap: 7px;
        margin-top: 10px;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .opportunity-live-check.good {
        border-color: rgba(20, 125, 100, 0.35);
        background: #f2faf6;
      }

      .opportunity-live-check.warn {
        border-color: rgba(162, 98, 19, 0.35);
        background: #fff8ec;
      }

      .opportunity-live-check.bad {
        border-color: rgba(184, 58, 53, 0.28);
        background: #fff4f2;
      }

      .opportunity-live-check strong {
        font-size: 12px;
      }

      .opportunity-live-check p {
        margin: 0;
        color: var(--ink);
        font-size: 12px;
        line-height: 1.45;
      }

      .review-card {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .review-card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .review-title {
        font-size: 15px;
        font-weight: 850;
        line-height: 1.3;
      }

      .review-market-list {
        display: grid;
        gap: 7px;
        margin-top: 10px;
      }

      .review-market {
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .review-market-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 760;
      }

      .review-market ul {
        margin: 7px 0 0;
        padding-left: 17px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .opportunity-empty {
        padding: 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 22px;
        padding: 24px 28px 42px;
      }

      .main {
        min-width: 0;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 0 0 12px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 17px;
        line-height: 1.2;
      }

      .last-update {
        color: var(--muted);
        font-size: 12px;
      }

      .match-grid {
        display: block;
      }

      .match-switcher {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .match-tab {
        flex: 0 0 auto;
        min-width: 178px;
        max-width: 240px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .match-tab.active {
        border-color: #1f6b54;
        background: #e8f2ee;
      }

      .match-tab-title {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 750;
      }

      .match-tab-meta {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .match-panels {
        display: grid;
        gap: 16px;
      }

      .match-panel {
        display: none;
      }

      .match-panel.active {
        display: block;
      }

      .match-card,
      .side-panel,
      .source-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .match-card {
        padding: 16px;
      }

      .match-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .teams {
        min-width: 0;
      }

      .teams h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
      }

      .meta-line {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 8px;
        border-radius: 999px;
        background: #eef3ef;
        color: #2d493c;
        font-size: 12px;
        white-space: nowrap;
      }

      .confidence-panel {
        display: grid;
        grid-template-columns: minmax(220px, 0.85fr) minmax(0, 1.15fr);
        gap: 12px;
        margin: 14px 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .mode-card {
        min-width: 0;
      }

      .mode-label {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 8px;
        border-radius: 6px;
        background: #eef3ef;
        color: #2d493c;
        font-size: 12px;
        font-weight: 750;
      }

      .mode-label.low {
        background: #fff3dd;
        color: var(--amber);
      }

      .mode-label.high {
        background: #e2f3ec;
        color: var(--green);
      }

      .confidence-score {
        margin-top: 8px;
        font-size: 28px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .prediction-result {
        margin-top: 8px;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.15;
      }

      .prediction-prob {
        margin-top: 4px;
        color: var(--green);
        font-size: 28px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .prediction-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 10px;
      }

      .prediction-model-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin: 10px 0;
      }

      .prediction-model-metric {
        min-width: 0;
        padding: 9px;
        border: 1px solid #d9e7df;
        border-radius: 8px;
        background: #f7fbf8;
      }

      .prediction-model-metric span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.25;
      }

      .prediction-model-metric strong {
        display: block;
        margin-top: 3px;
        color: var(--ink);
        font-size: 15px;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
      }

      .prediction-situation {
        margin: 0 0 10px;
        padding: 10px;
        border: 1px solid #cfe0d7;
        border-radius: 8px;
        background: #f5faf7;
      }

      .prediction-situation-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }

      .prediction-situation-title {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 820;
        line-height: 1.3;
      }

      .prediction-situation-subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .prediction-situation-badge {
        flex: 0 0 auto;
        padding: 4px 7px;
        border-radius: 999px;
        background: #e1f1ea;
        color: var(--green);
        font-size: 11px;
        font-weight: 780;
        white-space: nowrap;
      }

      .situation-team-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .situation-team-card {
        min-width: 0;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .situation-team-card strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.25;
      }

      .situation-team-card span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .situation-team-card em {
        display: inline-block;
        margin-top: 6px;
        padding: 3px 6px;
        border-radius: 999px;
        background: #eef5f0;
        color: var(--green);
        font-size: 11px;
        font-style: normal;
        font-weight: 780;
      }

      .situation-notes {
        display: grid;
        gap: 5px;
        margin: 8px 0 0;
        padding-left: 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .prediction-prob-card {
        min-width: 0;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .prediction-prob-card strong {
        display: block;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
      }

      .prediction-prob-card span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .prediction-row-label {
        display: block;
        font-weight: 760;
        font-size: 13px;
        line-height: 1.25;
      }

      .prediction-market-line {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .prediction-edge {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        font-weight: 760;
      }

      .prediction-edge.good {
        color: var(--green);
      }

      .prediction-edge.bad {
        color: var(--red);
      }

      .prediction-reasons {
        display: grid;
        gap: 6px;
        margin: 0;
        padding-left: 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .prediction-evidence-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .prediction-evidence-card {
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .prediction-evidence-card strong {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
        color: var(--ink);
        font-size: 12px;
      }

      .prediction-evidence-card span {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .prediction-evidence-status {
        color: var(--green);
        font-size: 11px;
        font-weight: 760;
      }

      .trend-panel {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid #d9e7df;
        border-radius: 8px;
        background: #f7fbf8;
      }

      .trend-panel h4 {
        margin: 0 0 8px;
        font-size: 13px;
      }

      .trend-metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 8px;
      }

      .trend-metric {
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .trend-metric span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      .trend-metric strong {
        display: block;
        margin-top: 3px;
        font-size: 16px;
      }

      .trend-notes {
        margin: 0;
        padding-left: 18px;
        color: var(--text);
        font-size: 12px;
        line-height: 1.55;
      }

      .confidence-note {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .trade-plan {
        margin: 12px 0 14px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .trade-plan-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
        margin-bottom: 12px;
      }

      .trade-plan-kicker {
        color: var(--muted);
        font-size: 12px;
        font-weight: 720;
      }

      .trade-plan-summary {
        margin-top: 4px;
        font-size: 18px;
        font-weight: 800;
        line-height: 1.3;
      }

      .trade-plan-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }

      .trade-badge {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 8px;
        border-radius: 7px;
        background: #edf0ef;
        color: #59645f;
        font-size: 12px;
        font-weight: 750;
        white-space: nowrap;
      }

      .trade-badge.buy {
        background: #e2f3ec;
        color: var(--green);
      }

      .trade-badge.watch,
      .trade-badge.wait {
        background: #f7ead1;
        color: #8a5a0a;
      }

      .trade-badge.avoid {
        background: #f8e3e1;
        color: var(--danger);
      }

      .trade-plan-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }

      .trade-plan-box {
        min-width: 0;
        padding: 10px;
        border: 1px solid #e6ebe7;
        border-radius: 8px;
        background: #fff;
      }

      .trade-plan-box strong {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
      }

      .trade-plan-box span,
      .trade-plan-box li {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .trade-plan-box ul {
        display: grid;
        gap: 5px;
        margin: 0;
        padding-left: 16px;
      }

      .trade-plan-primary {
        color: var(--green);
        font-weight: 800;

      .elite-signal-market {
        min-width: 0;
        font-weight: 750;
        font-size: 13px;
      }

      .elite-signal-meta {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .elite-position-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .elite-position-table th,
      .elite-position-table td {
        padding: 7px 6px;
      }

      .elite-chip {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 7px;
        border-radius: 6px;
        background: #edf0ef;
        color: #59645f;
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
      }

      .elite-chip.hot {
        background: #e2f3ec;
        color: var(--green);
      }

      .elite-summary-trigger {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .elite-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        font-size: 11px;
      }

      .elite-inline-list {
        display: grid;
        gap: 7px;
      }

      .elite-inline-card {
        padding: 8px;
        border: 1px solid #e6ebe7;
        border-radius: 8px;
        background: #fff;
      }

      .elite-inline-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        font-weight: 750;
      }

      .elite-inline-meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .recommendations {
        overflow-x: auto;
      }

      .recommendation-main-row.expandable {
        cursor: pointer;
      }

      .recommendation-main-row.expandable:hover td {
        background: #fbfcfa;
      }

      .recommendation-main-row.expanded td {
        background: #f8fbf8;
      }

      .recommendation-main-row.expanded .elite-arrow {
        transform: rotate(90deg);
      }

      .market-cell-main {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .row-detail-cell {
        padding: 0;
        background: #fbfcfa;
      }

      .row-detail-panel {
        padding: 12px;
        border-bottom: 1px solid #edf0ec;
      }

      .row-detail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 12px;
      }

      .row-detail-title {
        font-weight: 760;
      }

      .row-detail-meta {
        color: var(--muted);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 9px 8px;
        text-align: left;
        border-bottom: 1px solid #edf0ec;
        vertical-align: middle;
      }

      th {
        color: var(--muted);
        font-weight: 650;
        white-space: nowrap;
      }

      td.numeric,
      th.numeric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .decision {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        padding: 0 8px;
        border-radius: 6px;
        font-weight: 650;
        white-space: nowrap;
      }

      .decision.BUY,
      .decision.BUY_SMALL {
        background: #e2f3ec;
        color: var(--green);
      }

      .decision.WATCH {
        background: #f8edda;
        color: var(--amber);
      }

      .decision.AVOID_OR_SELL {
        background: #f8e5e3;
        color: var(--red);
      }

      .decision.NO_TRADE,
      .decision.WAIT,
      .decision.BASELINE {
        background: #edf0ef;
        color: #59645f;
      }

      .decision-note {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .sidebar {
        display: grid;
        gap: 16px;
        align-content: start;
      }

      .side-panel {
        padding: 16px;
      }

      .side-panel h2,
      .source-card h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .source-card {
        padding: 14px;
      }

      .source-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #edf0ec;
      }

      .source-row:last-child {
        border-bottom: 0;
      }

      .source-name {
        font-weight: 650;
      }

      .source-detail {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .status {
        min-width: 62px;
        text-align: center;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
      }

      .status.ok {
        background: #e2f3ec;
        color: var(--green);
      }

      .status.fail {
        background: #f8e5e3;
        color: var(--red);
      }

      .status.pending {
        background: #fff3dd;
        color: var(--amber);
      }

      .market-list {
        display: grid;
        gap: 10px;
      }

      .market-item {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .market-question {
        font-size: 13px;
        font-weight: 650;
        line-height: 1.35;
      }

      .market-meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .token-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .token-row {
        display: grid;
        grid-template-columns: minmax(84px, 1fr) 58px 120px;
        align-items: center;
        gap: 8px;
      }

      .token-name {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .token-price {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        font-weight: 700;
      }

      .sparkline {
        width: 120px;
        height: 34px;
        border: 1px solid #e6ebe7;
        border-radius: 6px;
        background: #fff;
      }

      .market-sparkline {
        width: 148px;
        height: 38px;
      }

      .chart-cell {
        min-width: 158px;
      }

      .chart-source {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .chart-source.live {
        color: var(--green);
      }

      .empty,
      .error {
        padding: 14px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .error {
        border-color: #e6b7b4;
        color: var(--red);
        background: #fff8f7;
      }

      .note {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 1100px) {
        .content {
          grid-template-columns: 1fr;
        }

        .sidebar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        .topbar {
          align-items: flex-start;
          padding: 16px;
        }

        .actions {
          flex-wrap: wrap;
          justify-content: flex-end;
        }

        .opportunity-button span:not(.opportunity-count) {
          display: none;
        }

        .opportunity-modal {
          padding: 70px 14px 14px;
        }

        .content {
          padding: 16px;
        }

        .sidebar {
          grid-template-columns: 1fr;
        }

        .match-tab {
          min-width: 160px;
        }

        .match-header {
          flex-direction: column;
        }

        .confidence-panel,
        .trade-plan-head,
        .trade-plan-grid,
        .trend-metrics,
        .intel-grid,
        .static-grid,
        .h2h-summary-grid,
        .matchup-insight-grid,
        .line-profile-grid,
        .form-grid,
        .prediction-model-strip,
        .situation-team-grid,
        .bettingexpert-row,
        .live-stats-grid,
        .lineup-box,
        .framework-grid,
        .elite-summary-grid,
        .completeness-grid {
          grid-template-columns: 1fr;
        }

        .live-market-row {
          grid-template-columns: 1fr;
        }

        .live-panel-head {
          flex-direction: column;
        }

        .live-market-action {
          justify-self: start;
        }

        h1 {
          font-size: 18px;
        }
      }

        </div>

      <main class="content">
        <section class="main">

      function translateText(text) {
        if (currentLang !== "en" || !text) return text;
        let output = String(text);
        if (UI_TRANSLATIONS[output]) return UI_TRANSLATIONS[output];
        for (const [from, to] of Object.entries(UI_TRANSLATIONS)) {
          output = output.split(from).join(to);
        }
        for (const [pattern, replacement] of UI_REGEX_TRANSLATIONS) {
          output = output.replace(pattern, replacement);
        }
        return output;
      }

      function translateRenderedContent(scope = document) {
        if (currentLang !== "en") return;
        const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            const parent = node.parentElement;
            if (!parent || ["SCRIPT", "STYLE", "CANVAS"].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach((node) => {
          node.nodeValue = translateText(node.nodeValue);
        });
        scope.querySelectorAll("[title], [aria-label]").forEach((item) => {
          if (item.hasAttribute("title")) item.setAttribute("title", translateText(item.getAttribute("title")));
          if (item.hasAttribute("aria-label")) item.setAttribute("aria-label", translateText(item.getAttribute("aria-label")));
        });
      }

        currentLang = lang === "en" ? "en" : "zh";

      const fmtPct = (value) => {
        if (typeof value !== "number") return "-";

      const fmtPrice = (value) => {
        if (typeof value !== "number") return "-";
        return value.toFixed(2);

      const fmtNumber = (value, digits = 1) => {
        if (typeof value !== "number" || !Number.isFinite(value)) return "-";
        return value.toFixed(digits);
      };

      const fmtEdge = (value) => {
        if (typeof value !== "number") return "-";
        return `${value >= 0 ? "+" : ""}${(value * 100).toFixed(1)}%`;

      function formatWorldRanking(team) {
        const ranking = team?.worldRanking;
        if (!ranking?.rank) return ranking?.note || "未同步";
        const updated = ranking.updatedAt ? ` · ${ranking.updatedAt} 更新` : "";
        const source = ranking.source ? ` · ${ranking.source}` : "";
        return `FIFA 男足第 ${ranking.rank}${updated}${source}`;
      }

      function formatH2hWindow(headToHead) {
        if (!headToHead?.windowStart || !headToHead?.windowEnd) return "未同步";
        return `${headToHead.windowStart} - ${headToHead.windowEnd}`;
      }

      function formatH2hRecord(match, headToHead) {
        const summary = headToHead?.summary || {};
        if (summary.matches == null) return currentLang === "en" ? "Pending verification" : "待核验";
        return `${homeName(match)} ${summary.homeWins || 0} / 平 ${summary.draws || 0} / ${awayName(match)} ${summary.awayWins || 0}`;
      }

      function formatH2hGoals(match, headToHead) {
        const summary = headToHead?.summary || {};
        if (summary.homeGoals == null || summary.awayGoals == null) return currentLang === "en" ? "Pending verification" : "待核验";
        return `${homeName(match)} ${summary.homeGoals || 0} - ${summary.awayGoals || 0} ${awayName(match)}`;
      }

      function formatH2hMatchCount(headToHead) {
        const summary = headToHead?.summary || {};
        if (summary.matches == null) return currentLang === "en" ? "Pending verification" : "待核验";
        return summary.matches;

      function formatH2hFallback(summary) {

              <div class="form-meta">${escapeHtml(aiRead.source === "openai" ? "OpenAI" : currentLang === "en" ? "Rule fallback" : "规则 fallback")} · ${fmtTime(aiRead.updatedAt)}</div>

            <div class="matchup-insight-grid">

              <li><strong>${currentLang === "en" ? "Source" : "来源"}</strong><span>${matchup.sourceUrl ? `<a href="${escapeHtml(matchup.sourceUrl)}" target="_blank" rel="noreferrer">${escapeHtml(matchup.source || matchup.sourceUrl)}</a>` : escapeHtml(matchup.source || "-")} · ${fmtTime(matchup.updatedAt)}</span></li>

      function recentFormInline(match, side) {

            : `近 ${summary.matches} 场：${summary.wins || 0}胜${summary.draws || 0}平${summary.losses || 0}负，进 ${summary.goalsFor || 0} / 失 ${summary.goalsAgainst || 0}。`;

      function renderStaticInfo(match, staticItems) {

      const fmtMoney = (value) => {
        if (typeof value !== "number" || !Number.isFinite(value)) return "-";
        const abs = Math.abs(value);
        const sign = value < 0 ? "-" : "";
        if (abs >= 1000000) return `${sign}$${(abs / 1000000).toFixed(2)}M`;
        if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(1)}K`;
        return `${sign}$${abs.toFixed(0)}`;
      };

      const fmtShares = (value) => {
        if (typeof value !== "number" || !Number.isFinite(value)) return "-";
        return new Intl.NumberFormat(currentLang === "en" ? "en-US" : "zh-CN", {
          maximumFractionDigits: value >= 1000 ? 0 : 2
        }).format(value);
      };

      const shortWallet = (value) => {
        const wallet = String(value || "");
        return wallet.length > 12 ? `${wallet.slice(0, 6)}...${wallet.slice(-4)}` : wallet;
      };

      const profileUrlFor = (item = {}) => item.profileUrl || (item.proxyWallet ? `https://polymarket.com/profile/${encodeURIComponent(item.proxyWallet)}` : "");

      const renderProfileLink = (item = {}, label = null) => {

        return `<a class="elite-profile-link" href="${escapeHtml(url)}" target="_blank" rel="noreferrer" title="${escapeHtml(title)}">${escapeHtml(text)}↗</a>`;
      };

      const fmtLine = (value) => {
        if (typeof value !== "number") return "-";
        return value > 0 ? `+${value}` : `${value}`;
      };

      const fmtOdds = (odds) => {
        if (!odds || typeof odds.decimal !== "number") return "赔率 -";
        const american = typeof odds.american === "number"
          ? `${odds.american > 0 ? "+" : ""}${Math.round(odds.american)}`
          : "-";
        return `欧赔 ${odds.decimal.toFixed(2)} · 港赔 ${odds.hongKong.toFixed(2)} · 美赔 ${american}`;
      };

      const displayTeamName = (match, side) => {
        const name = side === "home" ? match.homeName : match.awayName;
        const englishName = side === "home" ? match.homeEnglishName : match.awayEnglishName;
        return currentLang === "en" && englishName ? englishName : name;

      const homeName = (match) => displayTeamName(match, "home");

      const livePolymarketRecommendations = (match) => (match.recommendations || []).filter((rec) =>
        rec.chart?.source === "Polymarket" && Array.isArray(rec.chart.history) && rec.chart.history.length >= 2
      );

      const shanghaiDateKey = (value) => {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        try {
          return new Intl.DateTimeFormat("sv-SE", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            timeZone: "Asia/Shanghai"
          }).format(date);
        } catch {
          return date.toISOString().slice(0, 10);
        }
      };

      const matchShanghaiDateKey = (match) => shanghaiDateKey(match?.kickoffShanghai || match?.kickoffLocal || "");

      const focusMatchdayMatches = (matches) => {
        const candidates = (matches || [])
          .filter((match) => !String(match.scheduleStatus || "").toLowerCase().includes("final"))
          .sort((a, b) => (new Date(a.kickoffShanghai || a.kickoffLocal || "").getTime() || 0) - (new Date(b.kickoffShanghai || b.kickoffLocal || "").getTime() || 0));
        if (!candidates.length) return [];
        const inProgress = candidates.find((match) => String(match.scheduleStatus || "").toLowerCase().includes("in_progress"));
        const todayShanghai = shanghaiDateKey(new Date().toISOString());
        const matchDates = [...new Set(candidates.map(matchShanghaiDateKey).filter(Boolean))].sort();
        const nextMatchDate = matchDates.find((date) => date >= todayShanghai) || matchDates[0];
        const targetDate = inProgress ? matchShanghaiDateKey(inProgress) : nextMatchDate;
        return candidates.filter((match) => matchShanghaiDateKey(match) === targetDate);
      };

      const fmtTime = (value) => {
        if (!value) return "-";
        try {
          return new Intl.DateTimeFormat(currentLang === "en" ? "en-US" : "zh-CN", {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
            timeZone: "Asia/Shanghai"
          }).format(new Date(value));
        } catch {
          return value;
        }
      };

      const fmtDateTime = (value) => {
        if (!value) return currentLang === "en" ? "Not returned" : "未返回";

            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
            timeZone: "Asia/Shanghai"
          }).format(new Date(value));
        } catch {
          return value;
        }
      };

      const statusLabel = (status) => ({

        queried: currentLang === "en" ? "Queried / pending" : "已查询/待确认",
        missing: currentLang === "en" ? "Missing" : "缺失"
      })[status] || (currentLang === "en" ? "Unknown" : "未知");

      const confidenceLabel = (confidence) => ({
        high: currentLang === "en" ? "High confidence" : "高置信",
        medium: currentLang === "en" ? "Medium confidence" : "中置信",

      })[confidence] || (currentLang === "en" ? "Low confidence" : "低置信");

      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

      function activeOpportunities(payload) {

        });

      function activeOpportunityObservations(payload) {
        const now = Date.now();
        return (payload?.observations || []).filter((item) => {

      function opportunityActionLabel(action) {

          push: currentLang === "en" ? "Push" : "走水",

        if (!check) return "";

            </div>

        const detail = check.error
          ? check.error
          : check.loading
            ? (currentLang === "en" ? "Fetching live market price..." : "正在拉取实时盘口价格...")
            : check.summary || check.verdict?.message || "";
        const priceLine = !check.loading && !check.error

              ${typeof check.priceChange === "number" ? `<span class="opportunity-chip ${check.priceChange <= 0 ? "good" : "warn"}">${escapeHtml(currentLang === "en" ? "Move" : "变动")} ${escapeHtml(fmtEdge(check.priceChange))}</span>` : ""}

          : "";
        const riskLines = !check.loading && !check.error && check.risks?.length

        return `

      function renderOpportunities(payload = currentOpportunities) {
        currentOpportunities = payload || { meta: {}, items: [] };
        const labels = APP_LABELS[currentLang];
        const items = activeOpportunities(currentOpportunities);
        const observations = activeOpportunityObservations(currentOpportunities);
        const totalActive = items.length + observations.length;
        const button = document.getElementById("opportunityButton");
        const count = document.getElementById("opportunityCount");
        const list = document.getElementById("opportunityList");
        const meta = document.getElementById("opportunityMeta");
        if (!button || !count || !list || !meta) return;
        document.querySelectorAll("[data-opportunity-tab]").forEach((tab) => {
          const active = tab.dataset.opportunityTab === currentOpportunityTab;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", active ? "true" : "false");
        });

        button.classList.toggle("live", totalActive > 0);
        button.classList.toggle("empty", totalActive === 0);
        count.textContent = String(totalActive);
        if (currentOpportunityTab === "review") {
          renderOpportunityReview();
          return;
        }
        if (currentOpportunityTab === "elite") {
          renderOpportunityElites();
          return;
        }
        const scanWindow = currentOpportunities.meta?.scanWindowDays
          ? `${currentLang === "en" ? "Window" : "扫描窗口"} ${currentOpportunities.meta.scanWindowDays}${currentLang === "en" ? "d" : "天"}`
          : "";
        const scanDate = currentOpportunities.meta?.scanDate ? `${currentLang === "en" ? "From" : "起始"} ${currentOpportunities.meta.scanDate}` : "";
        meta.textContent = [
          scanWindow,
          scanDate,
          `${currentLang === "en" ? "Buy radar" : "买入雷达"} ${items.length}`,
          `${currentLang === "en" ? "Observation radar" : "观察雷达"} ${observations.length}`,
          currentOpportunities.meta?.nextRefreshAt ? `${currentLang === "en" ? "Next" : "下次"} ${fmtTime(currentOpportunities.meta.nextRefreshAt)}` : labels.opportunityMetaEmpty,
          currentOpportunities.meta?.backgroundRefresh ? (currentLang === "en" ? "refreshing" : "刷新中") : ""
        ].filter(Boolean).join(" · ");

        if (!totalActive) {
          list.innerHTML = `<div class="opportunity-empty">${escapeHtml(labels.opportunityEmpty)}<div class="confidence-note">${escapeHtml(currentOpportunities.meta?.disclaimer || "研究辅助提醒，不自动下单，不承诺收益。")}</div></div>`;
          translateRenderedContent(list);
          return;
        }

        const strictHtml = items.length
          ? `
            <div class="opportunity-group-title">
              <span>${escapeHtml(currentLang === "en" ? "Buy Radar" : "买入雷达")}</span>
              <span class="confidence-note">${escapeHtml(currentLang === "en" ? "Strict price and data gates" : "严格价格与数据闸门")}</span>
            </div>
            ${renderOpportunityCards(items)}
          `
          : `
            <div class="opportunity-empty">${escapeHtml(currentLang === "en" ? "No item currently passes the strict buy radar." : "当前没有通过严格买入雷达的项目。")}<div class="confidence-note">${escapeHtml(currentLang === "en" ? "Observation items below are for re-checking, not buy instructions." : "下面的观察项只用于复核，不是买入指令。")}</div></div>
          `;
        const observationHtml = observations.length
          ? `
            <div class="opportunity-group-title">
              <span>${escapeHtml(currentLang === "en" ? "Observation Radar" : "观察雷达")}</span>
              <span class="confidence-note">${escapeHtml(currentLang === "en" ? "Live curves, near-threshold prices, and public tipster signals" : "实时曲线、接近阈值价格、公开用户信号")}</span>
            </div>
            ${renderOpportunityCards(observations, { observation: true })}
          `
          : "";
        list.innerHTML = `${strictHtml}${observationHtml}`;
        translateRenderedContent(list);

      async function loadOpportunities(force = false) {
        if (window.location.protocol === "file:") return;
        try {
          const params = new URLSearchParams();
          if (force) params.set("force", "1");
          const query = params.toString();
          const response = await fetch(`${basePath()}api/opportunities${query ? `?${query}` : ""}`, { cache: "no-store" });
          const data = await response.json();
          renderOpportunities(data);

          currentOpportunities = {
            meta: {
              ok: false,
              error: error.message,
              disclaimer: currentLang === "en" ? "Opportunity radar is temporarily unavailable." : "机会雷达暂时不可用。"

            items: [],
            observations: []
          };
          renderOpportunities(currentOpportunities);

        if (opportunityReviewLoading) return;
        if (!force && currentOpportunityReview.items?.length) return;
        opportunityReviewLoading = true;
        renderOpportunities(currentOpportunities);
        try {
          const response = await fetch(`${basePath()}api/opportunities/review?limit=40`, { cache: "no-store" });
          const data = await response.json();
          currentOpportunityReview = data;
        } catch (error) {
          currentOpportunityReview = {
            meta: {
              ok: false,
              error: error.message,
              disclaimer: currentLang === "en" ? "Forecast review is temporarily unavailable." : "预测复盘暂时不可用。"
            },
            totals: {},
            items: []
          };
        } finally {
          opportunityReviewLoading = false;
          renderOpportunities(currentOpportunities);
        }
      }

      async function loadOpportunityElites(force = false) {
        if (window.location.protocol === "file:") return;

        renderOpportunities(currentOpportunities);

      function findOpportunityItem(id) {
        return [
          ...activeOpportunities(currentOpportunities),
          ...activeOpportunityObservations(currentOpportunities)
        ].find((item) => item.id === id) || null;
      }

      async function checkOpportunityPrice(id) {
        if (!id || window.location.protocol === "file:") return;
        const item = findOpportunityItem(id);
        if (!item) return;
        opportunityChecks.set(id, { loading: true, checkedAt: new Date().toISOString() });
        renderOpportunities(currentOpportunities);
        try {
          const params = new URLSearchParams({
            id: item.id,
            matchId: item.matchId,
            marketKey: item.marketKey
          });
          if (typeof item.marketPrice === "number") params.set("marketPrice", String(item.marketPrice));
          if (typeof item.maxBuyPrice === "number") params.set("maxBuyPrice", String(item.maxBuyPrice));
          const response = await fetch(`${basePath()}api/opportunities/check?${params.toString()}`, { cache: "no-store" });
          const data = await response.json();
          if (!response.ok || data.ok === false) {
            throw new Error(data.message || data.error || "price check failed");
          }
          opportunityChecks.set(id, data);
          const targetItem = (currentOpportunities.items || []).find((candidate) => candidate.id === id);
          if (targetItem) {
            targetItem.marketPrice = data.marketPrice;
            targetItem.edge = data.edge;
            targetItem.maxBuyPrice = data.maxBuyPrice;
            targetItem.source = data.source || targetItem.source;
            targetItem.summary = data.summary || targetItem.summary;
          }
        } catch (error) {
          opportunityChecks.set(id, {
            error: error.message,
            checkedAt: new Date().toISOString()
          });
        } finally {
          renderOpportunities(currentOpportunities);
        }
      }

      function renderGroupSituation(match) {

        const summary = isEn ? situation.summaryEn : situation.summary;
        const notes = isEn ? (situation.matchNotesEn || []) : (situation.matchNotes || []);
        const teamCard = (team, fallbackName) => {

          const teamNotes = isEn ? (team.notesEn || []) : (team.notes || []);

            : `模型修正：${homeName(match)} xG ${impact.homeXgDelta > 0 ? "+" : ""}${fmtNumber(impact.homeXgDelta, 3)}，${awayName(match)} xG ${impact.awayXgDelta > 0 ? "+" : ""}${fmtNumber(impact.awayXgDelta, 3)}。`)

      function goalLeanDisplay(probabilities = {}) {
        const over25 = Number(probabilities.over25);
        const under25 = Number(probabilities.under25);
        const bttsYes = Number(probabilities.btts);
        const bttsNo = 1 - bttsYes;
        const totalLean = Number.isFinite(over25) && Number.isFinite(under25)
          ? (Math.abs(over25 - under25) < 0.06
            ? {
              zh: `大小2.5接近五五开（大 ${fmtPct(over25)} / 小 ${fmtPct(under25)}）`,
              en: `O/U2.5 near 50/50 (O ${fmtPct(over25)} / U ${fmtPct(under25)})`,
              gap: Math.abs(over25 - under25)
            }
            : under25 >= over25
            ? { zh: `小2.5 ${fmtPct(under25)}`, en: `U2.5 ${fmtPct(under25)}`, gap: under25 - over25 }
            : { zh: `大2.5 ${fmtPct(over25)}`, en: `O2.5 ${fmtPct(over25)}`, gap: over25 - under25 })
          : { zh: "大小球待算", en: "Total pending", gap: 0 };
        const bttsLean = Number.isFinite(bttsYes)
          ? (Math.abs(bttsYes - bttsNo) < 0.06
            ? {
              zh: `双进接近五五开（是 ${fmtPct(bttsYes)} / 否 ${fmtPct(bttsNo)}）`,
              en: `BTTS near 50/50 (Yes ${fmtPct(bttsYes)} / No ${fmtPct(bttsNo)})`,
              gap: Math.abs(bttsYes - bttsNo)
            }
            : bttsNo >= bttsYes
            ? { zh: `双进否 ${fmtPct(bttsNo)}`, en: `BTTS No ${fmtPct(bttsNo)}`, gap: bttsNo - bttsYes }
            : { zh: `双进是 ${fmtPct(bttsYes)}`, en: `BTTS Yes ${fmtPct(bttsYes)}`, gap: bttsYes - bttsNo })
          : { zh: "双进待算", en: "BTTS pending", gap: 0 };
        const tight = [totalLean.gap, bttsLean.gap].some((gap) => Number.isFinite(gap) && Math.abs(gap) < 0.06);
        return {
          text: currentLang === "en" ? `${totalLean.en} / ${bttsLean.en}` : `${totalLean.zh} / ${bttsLean.zh}`,
          note: tight
            ? (currentLang === "en" ? "near 50/50" : "接近五五开")
            : ""
        };
      }

      function renderAiPrediction(match) {
        const prediction = match.aiPrediction || {};
        const model = match.modelV2 || match.dynamicModel?.goldmanStyle || {};
        const modelAdjusted = model.adjusted || match.dynamicModel?.adjusted || {};
        const topScores = match.probabilities?.topScores || model.topScores || [];
        const topScoreText = topScores.length
          ? topScores.slice(0, 3).map((score) => `${score.score} ${fmtPct(score.probability)}`).join(" / ")
          : "-";
        const modelName = model.name || (currentLang === "en" ? "Elo-xG Poisson model" : "Elo-xG Poisson 概率模型");
        const modelStyle = model.style
          ? (currentLang === "en" ? model.style : model.style.replace("Goldman-style public methodology, not Goldman Sachs official model", "高盛式公开方法，不是高盛官方模型"))
          : "";
        const calibration = model.calibration || {};
        const calibrationText = calibration.applied
          ? (currentLang === "en"
            ? `Market calibration ${Math.round((calibration.marketWeight || 0) * 100)}%`
            : `盘口轻校准 ${Math.round((calibration.marketWeight || 0) * 100)}%`)
          : (currentLang === "en" ? "Independent model" : "独立模型");
        const highClass = prediction.confidence === "high" ? "high" : prediction.confidence === "low" ? "low" : "";
        const rows = prediction.rows || [
          { key: "home", label: `${homeName(match)}胜`, probability: match.probabilities.home },
          { key: "draw", label: "平局", probability: match.probabilities.draw },
          { key: "away", label: `${awayName(match)}胜`, probability: match.probabilities.away }
        ];
        const selectedRow = rows.find((row) => row.key === prediction.key) || rows[0] || {};
        const marketPrefix = match.manualMarkets?.sourceType === "auto-baseline" ? "参考价" : "盘口";
        const selectedMarket = typeof selectedRow.marketPrice === "number" ? `${marketPrefix} ${fmtPct(selectedRow.marketPrice)}` : "盘口缺失";
        const selectedEdge = typeof selectedRow.edge === "number" ? `Edge ${fmtPct(selectedRow.edge)}` : "Edge 缺失";
        const selectedSource = selectedRow.marketSource ? ` · ${selectedRow.marketSource}` : "";
        const restrictionText = prediction.restrictions?.length
          ? `限制：${prediction.restrictions.join("、")}`
          : "无关键限制，按 edge 和价格纪律判断。";
        const reasons = (prediction.reasons || []).slice(0, 3);
        const evidence = Array.isArray(prediction.evidence) ? prediction.evidence : [];
        const drivers = Array.isArray(prediction.modelDrivers) ? prediction.modelDrivers : [];
        const dataGaps = Array.isArray(prediction.dataGaps) ? prediction.dataGaps : [];
        const goalLean = goalLeanDisplay(match.probabilities || {});
        const statusText = (status) => ({
          synced: currentLang === "en" ? "synced" : "已同步",
          partial: currentLang === "en" ? "partial" : "部分",
          missing: currentLang === "en" ? "missing" : "缺失"
        })[status] || (currentLang === "en" ? "review" : "待核验");
        return `
          <section class="confidence-panel">
            <div class="mode-card">
              <span class="mode-label ${highClass}">AI综合预测</span>
              <div class="prediction-result">${escapeHtml(prediction.label || "等待预测")}</div>
              <div class="prediction-prob">AI ${fmtPct(prediction.probability)}</div>
              <div class="confidence-note">${escapeHtml(modelName)}${modelStyle ? ` · ${escapeHtml(modelStyle)}` : ""}</div>
              <div class="confidence-note">${escapeHtml(selectedMarket)} · ${escapeHtml(selectedEdge)}${escapeHtml(selectedSource)}</div>
              <div class="confidence-note">${confidenceLabel(prediction.confidence)} · ${escapeHtml(prediction.tradeLabel || "观察")} · ${escapeHtml(restrictionText)}</div>
            </div>
            <div>
              <div class="prediction-model-strip">
                <div class="prediction-model-metric">
                  <span>${escapeHtml(currentLang === "en" ? "Model xG" : "模型 xG")}</span>
                  <strong>${escapeHtml(fmtNumber(modelAdjusted.lambdaHome, 2))} - ${escapeHtml(fmtNumber(modelAdjusted.lambdaAway, 2))}</strong>
                </div>
                <div class="prediction-model-metric">
                  <span>${escapeHtml(currentLang === "en" ? "Top scores" : "主比分")}</span>
                  <strong>${escapeHtml(topScoreText)}</strong>
                </div>
                <div class="prediction-model-metric">
                  <span>${escapeHtml(currentLang === "en" ? "Goal lean" : "进球概率较高侧")}</span>
                  <strong>${escapeHtml(goalLean.text)}${goalLean.note ? ` · ${escapeHtml(goalLean.note)}` : ""}</strong>
                </div>
                <div class="prediction-model-metric">
                  <span>${escapeHtml(currentLang === "en" ? "Calibration" : "校准")}</span>
                  <strong>${escapeHtml(calibrationText)}</strong>
                </div>
              </div>
              ${renderGroupSituation(match)}
              <div class="prediction-grid">
                ${rows.map((row) => `
                  <div class="prediction-prob-card">
                    <span class="prediction-row-label">${escapeHtml(row.marketTypeLabel ? `${row.marketTypeLabel} · ${row.label}` : row.label)}</span>
                    <strong>AI ${fmtPct(row.probability)}</strong>
                    <span class="prediction-market-line">${escapeHtml(row.marketSource === "Polymarket" ? "盘口" : marketPrefix)} ${fmtPct(row.marketPrice)}${row.marketSource ? ` · ${escapeHtml(row.marketSource)}` : ""}</span>
                    <span class="prediction-edge ${typeof row.edge === "number" && row.edge > 0 ? "good" : typeof row.edge === "number" && row.edge < 0 ? "bad" : ""}">Edge ${fmtPct(row.edge)}</span>
                  </div>
                `).join("")}
              </div>
              ${prediction.marketRead ? `<div class="form-summary">${escapeHtml(prediction.marketRead)}</div>` : ""}
              ${evidence.length ? `
                <div class="prediction-evidence-grid">
                  ${evidence.map((item) => `
                    <div class="prediction-evidence-card">
                      <strong>${escapeHtml(item.label || "-")}<em class="prediction-evidence-status">${escapeHtml(statusText(item.status))}</em></strong>
                      <span>${escapeHtml(item.detail || "")}</span>
                    </div>

                </div>
              ` : ""}
              ${drivers.length ? `<ul class="prediction-reasons">${drivers.slice(0, 4).map((reason) => `<li>${escapeHtml(reason)}</li>`).join("")}</ul>` : ""}
              ${dataGaps.length ? `<ul class="prediction-reasons">${dataGaps.slice(0, 4).map((gap) => `<li>${escapeHtml(currentLang === "en" ? "Data gap: " : "数据缺口：")}${escapeHtml(gap)}</li>`).join("")}</ul>` : ""}
              ${!evidence.length && reasons.length ? `<ul class="prediction-reasons">${reasons.map((reason) => `<li>${escapeHtml(reason)}</li>`).join("")}</ul>` : ""}
            </div>
          </section>
        `;
      }

        if (!markets.length) {

      function drawSparklines(scope = document) {
        scope.querySelectorAll(".sparkline").forEach((canvas) => {
          let points = [];
          try {
            points = JSON.parse(decodeURIComponent(canvas.dataset.series || "[]"));
          } catch {
            points = [];
          }
          const ctx = canvas.getContext("2d");
          const width = canvas.width;
          const height = canvas.height;
          ctx.clearRect(0, 0, width, height);
          ctx.strokeStyle = "#d9dfd8";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, height - 1);
          ctx.lineTo(width, height - 1);
          ctx.stroke();

          if (points.length < 2) {
            ctx.fillStyle = "#8b958f";
            ctx.font = "11px system-ui, sans-serif";
            ctx.fillText(currentLang === "en" ? "Local ref" : "本地参考", 26, 21);
            return;
          }

          const prices = points.map((point) => point.p);
          const min = Math.min(...prices, 0);
          const max = Math.max(...prices, 1);
          const span = Math.max(0.01, max - min);
          ctx.strokeStyle = "#147d64";
          ctx.lineWidth = 2;
          ctx.beginPath();
          points.forEach((point, index) => {
            const x = points.length === 1 ? width - 2 : (index / (points.length - 1)) * (width - 4) + 2;
            const y = height - 4 - ((point.p - min) / span) * (height - 8);
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        });
      }

      const chartColors = ["#147d64", "#245a9c", "#a26213", "#b83a35", "#6b7280", "#7c3aed"];

      function drawBigCharts(scope = document) {
        scope.querySelectorAll(".odds-big-chart").forEach((canvas) => {
          let series = [];
          try {
            series = JSON.parse(decodeURIComponent(canvas.dataset.series || "[]"));
          } catch {
            series = [];
          }
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const width = Math.max(320, Math.round(rect.width || 760));
          const height = Math.max(220, Math.round(rect.height || 260));
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          const ctx = canvas.getContext("2d");
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, width, height);

          const pad = { left: 42, right: 48, top: 18, bottom: 30 };
          const plotW = width - pad.left - pad.right;
          const plotH = height - pad.top - pad.bottom;
          ctx.fillStyle = "#fbfcfa";
          ctx.fillRect(0, 0, width, height);

          const liveSeries = series.filter((item) => Array.isArray(item.history) && item.history.length >= 2);
          const values = liveSeries.flatMap((item) => item.history.map((point) => point.p));
          if (!values.length) {
            const emptyMessage = currentLang === "en" ? "No live curve" : "暂无实时曲线";
            ctx.fillStyle = "#66706b";
            ctx.font = "13px system-ui, sans-serif";
            ctx.fillText(emptyMessage, pad.left, pad.top + 24);
            return;
          }

          const minY = Math.max(0, Math.min(...values) - 0.04);
          const maxY = Math.min(1, Math.max(...values) + 0.04);
          const spanY = Math.max(0.01, maxY - minY);
          const times = liveSeries.flatMap((item) => item.history.map((point) => point.t));
          const minT = Math.min(...times);
          const maxT = Math.max(...times);
          const spanT = Math.max(1, maxT - minT);

          ctx.strokeStyle = "#d9dfd8";
          ctx.lineWidth = 1;
          ctx.font = "12px system-ui, sans-serif";
          ctx.fillStyle = "#66706b";
          [0, 0.25, 0.5, 0.75, 1].forEach((ratio) => {
            const y = pad.top + plotH * ratio;
            ctx.beginPath();
            ctx.moveTo(pad.left, y);
            ctx.lineTo(width - pad.right, y);
            ctx.stroke();
            const label = `${Math.round((maxY - spanY * ratio) * 100)}%`;
            ctx.fillText(label, width - pad.right + 8, y + 4);
          });

          liveSeries.forEach((item, index) => {
            const history = item.history || [];
            const color = chartColors[index % chartColors.length];
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            history.forEach((point, pointIndex) => {
              const x = pad.left + ((point.t - minT) / spanT) * plotW;
              const y = pad.top + (1 - (point.p - minY) / spanY) * plotH;
              if (pointIndex === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();

            const last = history[history.length - 1];
            const lastX = pad.left + ((last.t - minT) / spanT) * plotW;
            const lastY = pad.top + (1 - (last.p - minY) / spanY) * plotH;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
            ctx.fill();
          });
        });
      }

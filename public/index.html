            </div>
            <div class="odds-board-tabs" role="tablist" aria-label="盘口切换">${tabs}</div>
            <div class="odds-board-meta">${escapeHtml(currentLang === "en" ? "A Live tab has matched Polymarket history. A Local tab means Polymarket has not returned that single-match market yet." : "标签里的“实时”表示该类盘口已匹配 Polymarket 历史曲线；“本地”表示 Polymarket 当前未返回对应单场盘口。")}</div>
            ${panels}
            ${renderMarketCatalog(match.marketCatalog)}
          </section>
        `;
      }

      function marketCatalogCategoryLabel(group) {
        return currentLang === "en" ? (group.labelEn || group.label || group.key) : (group.label || group.key);
      }

      function formatMarketVolume(value) {
        const n = Number(value || 0);
        if (!Number.isFinite(n) || n <= 0) return "-";
        if (n >= 1000000) return `$${(n / 1000000).toFixed(2)}M`;
        if (n >= 1000) return `$${(n / 1000).toFixed(1)}K`;
        return `$${n.toFixed(0)}`;
      }

      function renderMarketCatalog(catalog) {
        const categories = catalog?.categories || [];
        if (!categories.length) {
          return `
            <div class="market-catalog">
              <div class="market-catalog-head">
                <div>
                  <div class="market-catalog-title">${escapeHtml(currentLang === "en" ? "Additional Polymarket Markets" : "更多 Polymarket 盘口")}</div>
                  <div class="market-catalog-meta">${escapeHtml(currentLang === "en" ? "No derivative markets were returned for this match." : "这场暂未返回球胆、半场、球队总进球等衍生盘口。")}</div>
                </div>
              </div>
            </div>
          `;
        }
        const preferred = ["correctScore", "halves", "teamTotals", "totals", "spreads", "btts", "moneyline", "other"];
        const ordered = [...categories].sort((a, b) => preferred.indexOf(a.key) - preferred.indexOf(b.key));
        const activeIndex = Math.max(0, ordered.findIndex((group) => ["correctScore", "halves"].includes(group.key)));
        const tabs = ordered.map((group, index) => `
          <button class="market-catalog-tab ${index === activeIndex ? "active" : ""}" data-market-catalog-tab="${escapeHtml(group.key)}" type="button">
            ${escapeHtml(marketCatalogCategoryLabel(group))} · ${escapeHtml(group.count || group.markets.length)}
          </button>
        `).join("");
        const panels = ordered.map((group, index) => `
          <div class="market-catalog-panel ${index === activeIndex ? "active" : ""}" data-market-catalog-panel="${escapeHtml(group.key)}">
            ${group.markets.slice(0, 18).map((market) => `
              <div class="market-catalog-row">
                <div class="market-catalog-question">
                  <strong>${escapeHtml(market.question || market.slug || "-")}</strong>
                  <span>${escapeHtml(market.sportsMarketType || market.slug || "")}</span>
                </div>
                <div class="market-catalog-outcomes">
                  ${(market.outcomes || []).map((outcome) => `
                    <span class="market-outcome-pill">${escapeHtml(outcome.label || "-")} <span>${fmtPrice(outcome.price)}</span></span>
                  `).join("")}
                </div>
                <div class="market-catalog-volume">${escapeHtml(formatMarketVolume(market.volume))}</div>
              </div>
            `).join("") || `<div class="market-catalog-row"><div class="market-catalog-question"><strong>${escapeHtml(currentLang === "en" ? "Not returned for this match" : "这场暂未返回该类盘口")}</strong><span>${escapeHtml(currentLang === "en" ? "Polymarket may not open every derivative market for every match." : "Polymarket 不一定每场都开球胆、半场或其他衍生盘；这里不做伪造。")}</span></div><div class="market-catalog-outcomes"></div><div class="market-catalog-volume">-</div></div>`}
          </div>
        `).join("");
        return `
          <div class="market-catalog">
            <div class="market-catalog-head">
              <div>
                <div class="market-catalog-title">${escapeHtml(currentLang === "en" ? "Additional Polymarket Markets" : "更多 Polymarket 盘口")}</div>
                <div class="market-catalog-meta">${escapeHtml(currentLang === "en"
                  ? "Browse derivative markets such as correct score, halves, team totals, alternate totals, and alternate spreads. These are shown as market data, not model buy recommendations."
                  : "展示球胆/正确比分、半场、球队进球数、更多大小球和更多让球线。这里只是盘口数据，不等于模型买入建议。")}</div>
              </div>
              <div class="market-catalog-meta">${escapeHtml(catalog?.source || "Polymarket")} · ${escapeHtml(catalog?.marketCount || 0)} ${escapeHtml(currentLang === "en" ? "markets" : "个盘口")}</div>
            </div>
            <div class="market-catalog-tabs">${tabs}</div>
            ${panels}
          </div>
        `;
      }

      function renderLineupTeam(teamName, lineup) {
        const xi = Array.isArray(lineup?.xi) && lineup.xi.length ? lineup.xi : ["待确认"];
        return `
          <div class="lineup-team">
            <div class="lineup-team-title">${escapeHtml(teamName)}</div>
            <div class="lineup-meta">阵型：${escapeHtml(lineup?.formation || "待确认")}</div>
            <ol class="lineup-list">${xi.map((player) => `<li>${escapeHtml(player)}</li>`).join("")}</ol>
            <div class="lineup-meta">${escapeHtml(lineup?.notes || "等待公开源更新。")}</div>
          </div>
        `;
      }

      function renderResearchFramework(framework) {
        const dimensions = framework?.staticDimensions || [];
        if (!dimensions.length) {
          return '<div class="empty">研究框架未加载。</div>';
        }
        return `
          <div class="framework-grid">
            ${dimensions.map((item) => `
              <div class="framework-item">
                <strong>${escapeHtml(item.label)}</strong>
                <span>${escapeHtml((item.fields || []).slice(0, 3).join(" / "))}</span>
              </div>
            `).join("")}
          </div>
        `;
      }

      function renderMatchIntel(match) {
        const context = match.context || {};
        const lineups = context.lineups || {};
        const dynamicModel = match.dynamicModel || {
          base: { lambdaHome: match.model?.lambdaHome || 0, lambdaAway: match.model?.lambdaAway || 0 },
          adjusted: { lambdaHome: match.model?.lambdaHome || 0, lambdaAway: match.model?.lambdaAway || 0 },
          modelImpacts: []
        };
        const impacts = dynamicModel.modelImpacts || [];
        const ai = context.aiAnalysis || {};
        const riskFlags = Array.isArray(context.riskFlags) ? context.riskFlags : [];
        const sources = context.sources || {};
        const sourceStateLabel = (source = {}) => {
          if (source.status === "queried-unconfirmed") return currentLang === "en" ? "Queried / unconfirmed" : "已查询/未确认";
          if (source.status === "rule-fallback") return currentLang === "en" ? "Rule fallback" : "规则兜底";
          if (source.status === "baseline") return currentLang === "en" ? "Baseline" : "基线";
          if (source.status === "coordinate-ready") return currentLang === "en" ? "Venue ready" : "场馆已配置";
          if (source.status === "queried-low-signal") return currentLang === "en" ? "Queried / low signal" : "已查询/低信号";
          if (source.status === "verified-or-summarized") return currentLang === "en" ? "Summarized" : "已摘要";
          if (source.status === "summarized") return currentLang === "en" ? "Summarized" : "已摘要";
          return source.ok ? (currentLang === "en" ? "OK" : "正常") : (currentLang === "en" ? "Failed" : "失败");
        };
        const sourceRows = Object.entries(sources).map(([key, source]) => `
          <li><strong>${escapeHtml(key)}</strong><span>${escapeHtml(sourceStateLabel(source))}${source.confidence ? ` · ${confidenceLabel(source.confidence)}` : ""}${source.error ? ` · ${escapeHtml(source.error)}` : ""} · ${fmtTime(source.updatedAt)} ${source.url ? `· ${escapeHtml(source.url)}` : ""}</span></li>
        `).join("");
        return `
          <div class="intel-grid">
            <section class="intel-block wide">
              <h4>预计/官方首发</h4>
              <ul class="info-list">
                <li><strong>首发状态</strong><span>${escapeHtml(lineups.statusLabel || "待确认")}</span></li>
              </ul>
              <div class="lineup-box">
                ${renderLineupTeam(homeName(match), lineups.home)}
                ${renderLineupTeam(awayName(match), lineups.away)}
              </div>
            </section>

            <section class="intel-block">
              <h4>伤停停赛</h4>
              <ul class="info-list">
                <li><strong>摘要</strong><span>${escapeHtml(context.injurySummary || "未同步")}</span></li>
              </ul>
            </section>

            <section class="intel-block">
              <h4>球队近况</h4>
              <ul class="info-list">
                <li><strong>${escapeHtml(homeName(match))}</strong><span>${escapeHtml(recentFormInline(match, "home"))}</span></li>
                <li><strong>${escapeHtml(awayName(match))}</strong><span>${escapeHtml(recentFormInline(match, "away"))}</span></li>
                <li><strong>球队新闻</strong><span>${escapeHtml(context.teamNewsSummary || "未同步")}</span></li>
              </ul>
            </section>

            <section class="intel-block">
              <h4>战术对位</h4>
              <ul class="info-list">
                <li><strong>对位判断</strong><span>${escapeHtml(context.tacticalMatchup || "等待阵容和赛前 preview")}</span></li>
              </ul>
            </section>

            <section class="intel-block">
              <h4>天气和场地</h4>
              <ul class="info-list">
                <li><strong>天气</strong><span>${escapeHtml(context.weather?.summary || "未同步")}</span></li>
                <li><strong>更新时间</strong><span>${fmtTime(context.weather?.updatedAt)}</span></li>
              </ul>
            </section>

            <section class="intel-block wide">
              <h4>AI 综合分析</h4>
              <ul class="info-list">
                <li><strong>状态</strong><span>${ai.ok ? `已分析 · ${escapeHtml(ai.model || "")}` : escapeHtml(ai.error || "未启用")}</span></li>
                <li><strong>结论</strong><span>${escapeHtml(ai.summary || "等待服务器配置 OPENAI_API_KEY 后定时综合。")}</span></li>
                ${riskFlags.length ? `<li><strong>风险点</strong><span>${escapeHtml(riskFlags.join(" / "))}</span></li>` : ""}
              </ul>
            </section>

            <section class="intel-block wide">
              <h4>动态信息对模型的影响</h4>
              <ul class="info-list">
                <li><strong>基线 xG</strong><span>${dynamicModel.base.lambdaHome.toFixed(2)} - ${dynamicModel.base.lambdaAway.toFixed(2)}</span></li>
                <li><strong>动态 xG</strong><span>${dynamicModel.adjusted.lambdaHome.toFixed(2)} - ${dynamicModel.adjusted.lambdaAway.toFixed(2)}</span></li>
                ${impacts.length ? impacts.map((impact) => `<li><strong>${escapeHtml(impact.label)}</strong><span>${escapeHtml(impact.reason)} · xG ${impact.homeXgDelta > 0 ? "+" : ""}${impact.homeXgDelta.toFixed(2)} / ${impact.awayXgDelta > 0 ? "+" : ""}${impact.awayXgDelta.toFixed(2)}</span></li>`).join("") : '<li><strong>调整</strong><span>暂无可确认动态调整，维持基线模型。</span></li>'}
              </ul>
            </section>

            <section class="intel-block wide">
              <h4>研究框架维度</h4>
              ${renderResearchFramework(window.dashboardResearchFramework)}
            </section>

            <section class="intel-block wide">
              <h4>来源和置信度</h4>
              <ul class="info-list">
                <li><strong>情报更新时间</strong><span>${fmtTime(context.updatedAt)}</span></li>
                ${sourceRows || '<li><strong>来源</strong><span>未同步</span></li>'}
              </ul>
            </section>
          </div>
        `;
      }

      function renderEliteSignals(match) {
        const summary = match.eliteSummary || {};
        const rows = (match.recommendations || []).filter((rec) => rec.eliteSummary?.count > 0 || rec.holderSummary?.count > 0);
        const updated = summary.updatedAt ? fmtTime(summary.updatedAt) : "-";
        const sourceText = summary.source || "Polymarket Data API /v1/market-positions";
        return `
          <div class="elite-summary-grid">
            <div class="elite-stat"><span>当前盘口高手持仓</span><strong>${escapeHtml(summary.activePositions || 0)}</strong></div>
            <div class="elite-stat"><span>涉及高手账号</span><strong>${escapeHtml(summary.activeTraders || 0)}</strong></div>
            <div class="elite-stat"><span>顶级持仓者</span><strong>${escapeHtml(summary.topHolderPositions || 0)}</strong></div>
            <div class="elite-stat"><span>当前价值 / 累计参与</span><strong>${fmtMoney(summary.totalCurrentValue || 0)} / ${fmtMoney(summary.totalBought || 0)}</strong></div>
          </div>
          <ul class="info-list">
            <li><strong>数据口径</strong><span>顶级持仓者来自当前 token 的公开 holder 列表；高手标记表示该账号同时命中世界杯账号 Top 10。</span></li>
            <li><strong>来源</strong><span>${escapeHtml(sourceText)} · ${updated}</span></li>
          </ul>
          <div class="elite-signal-list">
            ${rows.length ? rows.map((rec) => `
              <section class="elite-signal">
                <div class="elite-signal-head">
                  <div class="elite-signal-market">${escapeHtml(rec.name)} · ${escapeHtml(rec.marketTypeLabel || "")}</div>
                  <div class="elite-signal-meta">持仓 ${escapeHtml(rec.holderSummary?.count || 0)} 人 · 高手 ${escapeHtml(rec.eliteSummary?.count || 0)} 人 · 份额 ${fmtShares(rec.holderSummary?.totalShares || 0)}</div>
                </div>
                <table class="elite-position-table">
                  <thead>
                    <tr>
                      <th>账号</th>
                      <th class="numeric">份额</th>
                      <th class="numeric">均价</th>
                      <th class="numeric">当前价值</th>
                      <th class="numeric">累计参与</th>
                      <th>命中世界杯Top10</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(rec.topHolders || []).slice(0, 25).map((holder) => `
                      <tr>
                        <td>#${escapeHtml(holder.holderRank)} ${escapeHtml(holder.userName)}<div class="source-detail">${escapeHtml(shortWallet(holder.proxyWallet))} · ${escapeHtml(holder.outcome || rec.name)}</div></td>
                        <td class="numeric">${fmtShares(holder.size)}</td>
                        <td class="numeric">${fmtPrice(holder.avgPrice)}</td>
                        <td class="numeric">${fmtMoney(holder.currentValue)}</td>
                        <td class="numeric">${fmtMoney(holder.totalBought)}</td>
                        <td>${holder.isElite ? `#${escapeHtml(holder.worldCupRank || holder.traderRank)} · 世界杯胜率 ${fmtPct(holder.worldCupWinRateEstimate ?? holder.winRateEstimate)} · 世界杯PNL ${fmtMoney(holder.worldCupPnl || 0)} · 样本 ${escapeHtml(holder.worldCupSettledPositions || 0)}` : "否"}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </section>
            `).join("") : '<div class="empty">当前这些盘口暂未返回公开持仓。</div>'}
          </div>
        `;
      }

      function renderEliteSummaryChip(rec) {
        if (rec.eliteSummary?.count) return `<span class="elite-chip hot">高手 ${escapeHtml(rec.eliteSummary.count)}人 · ${fmtMoney(rec.eliteSummary.totalCurrentValue)}</span>`;
        if (rec.holderSummary?.count) return `<span class="elite-chip">${escapeHtml(rec.holderSummary.count)}持仓者 · ${fmtShares(rec.holderSummary.totalShares)}</span>`;
        return "";
      }

      function renderEliteRowDetails(rec) {
        const signals = rec.eliteSignals || [];
        const holders = rec.topHolders || [];
        if (!rec.eliteSummary?.count && !rec.holderSummary?.count) return '<div class="row-detail-panel"><div class="empty">当前这个盘口暂未返回公开持仓。</div></div>';
        return `
          <div class="row-detail-panel">
            <div class="row-detail-head">
              <div class="row-detail-title">${escapeHtml(rec.name)} · 顶级持仓者</div>
              <div class="row-detail-meta">持仓 ${escapeHtml(rec.holderSummary?.count || 0)} 人 · 份额 ${fmtShares(rec.holderSummary?.totalShares || 0)} · 高手 ${escapeHtml(rec.eliteSummary?.count || 0)} 人 · Top ${escapeHtml(rec.holderSummary?.topHolder || rec.eliteSummary?.topTrader || "-")}</div>
            </div>
            <div class="elite-inline-list">
              ${holders.slice(0, 20).map((holder) => `
                <div class="elite-inline-card">
                  <div class="elite-inline-head">
                    <span>#${escapeHtml(holder.holderRank)} ${escapeHtml(holder.userName)}${renderProfileLink(holder)}</span>
                    <span>${fmtShares(holder.size)}</span>
                  </div>
                  <div class="elite-inline-meta">
                    钱包 ${escapeHtml(shortWallet(holder.proxyWallet))} · 方向 ${escapeHtml(holder.outcome || rec.name)} · 均价 ${fmtPrice(holder.avgPrice)} · 当前 ${fmtMoney(holder.currentValue)} · 累计参与 ${fmtMoney(holder.totalBought)}
                  </div>
                  <div class="elite-inline-meta">
                    ${holder.isElite ? `命中方向型世界杯高手 #${escapeHtml(holder.worldCupRank || holder.traderRank)} · ${escapeHtml(holder.traderStyleLabel || "")} · 世界杯胜率 ${fmtPct(holder.worldCupWinRateEstimate ?? holder.winRateEstimate)} · 世界杯PNL ${fmtMoney(holder.worldCupPnl || 0)} · 样本 ${escapeHtml(holder.worldCupSettledPositions || 0)}` : "未命中方向型世界杯高手"}
                  </div>
                </div>
              `).join("")}
              ${signals.length ? `<div class="source-detail">方向型世界杯高手命中账号：${signals.slice(0, 12).map((signal) => `#${escapeHtml(signal.worldCupRank || signal.traderRank)} ${escapeHtml(signal.userName)}${renderProfileLink(signal)}`).join("，")}</div>` : ""}
            </div>
          </div>
        `;
      }

      function renderMatch(match) {
        const rows = match.recommendations.map((rec, index) => {
          const detailId = `rec-detail-${escapeHtml(match.id)}-${index}`;
          const hasEliteSignals = Boolean(rec.eliteSummary?.count);
          const hasHolderSignals = Boolean(rec.holderSummary?.count);
          const hasExpandableSignals = hasEliteSignals || hasHolderSignals;
          const isReferencePrice = rec.chart?.source === "本地盘口快照" || match.manualMarkets?.sourceType === "auto-baseline";
          const priceLabel = `${fmtPrice(rec.marketPrice)}${isReferencePrice ? " 参考" : ""}`;
          const advicePriceLabel = rec.decision?.gated
            ? (typeof rec.marketPrice === "number" ? "观察" : "等待")
            : fmtPrice(rec.maxBuyPrice);
          const hasLiveChart = rec.chart?.source === "Polymarket" && Array.isArray(rec.chart?.history) && rec.chart.history.length >= 2;
          const chartStatus = hasLiveChart
            ? (currentLang === "en" ? "Polymarket live curve" : "Polymarket 实时曲线")
            : rec.chart?.source === "本地盘口快照" && rec.marketType === "handicap"
              ? (currentLang === "en" ? "No Polymarket handicap yet; local reference" : "Polymarket 暂无让球盘，显示本地参考价")
              : rec.chart?.source === "本地盘口快照"
                ? (currentLang === "en" ? "No Polymarket single-match market yet; local reference" : "Polymarket 暂无单场盘，显示本地参考价")
                : (currentLang === "en" ? "No Polymarket live curve yet" : "Polymarket 暂无实时曲线");
          return `
          <tr class="recommendation-main-row ${hasExpandableSignals ? "expandable" : ""}" data-detail-id="${detailId}" aria-expanded="false" ${hasExpandableSignals ? 'tabindex="0"' : ""}>
            <td>${escapeHtml(rec.marketTypeLabel || "-")}</td>
            <td>
              <span class="market-cell-main">
                ${hasExpandableSignals ? '<span class="elite-arrow" aria-hidden="true">›</span>' : ""}
                <span>${escapeHtml(rec.name)}</span>
                ${renderEliteSummaryChip(rec)}
              </span>
              ${rec.holderSummary?.count ? `<div class="decision-note">Top holder: ${escapeHtml(rec.holderSummary.topHolder || "-")} · 份额 ${fmtShares(rec.holderSummary.totalShares)}</div>` : ""}
            </td>
            <td class="numeric">${fmtPct(rec.modelProbability)}</td>
            <td class="numeric">${fmtPct(rec.pushProbability)}</td>
            <td class="numeric">${escapeHtml(priceLabel)}</td>
            <td>${escapeHtml(fmtOdds(rec.odds))}</td>
            <td class="numeric">${fmtPct(rec.edge)}</td>
            <td class="numeric">${escapeHtml(advicePriceLabel)}</td>
            <td class="chart-cell">
              <canvas class="sparkline market-sparkline" width="148" height="38" data-series="${encodeURIComponent(JSON.stringify(hasLiveChart ? rec.chart.history : []))}" aria-label="${escapeHtml(rec.name)} 价格曲线"></canvas>
              <div class="chart-source ${hasLiveChart ? "live" : ""}">${escapeHtml(chartStatus)}</div>
            </td>
            <td>
              <span class="decision ${rec.decision.action}">${escapeHtml(rec.decision.label)}</span>
              ${rec.decision.reasons?.length ? `<div class="decision-note">${escapeHtml(rec.decision.reasons.join("；"))}</div>` : ""}
            </td>
          </tr>
          ${hasExpandableSignals ? `<tr class="recommendation-detail-row" id="${detailId}" hidden>
            <td class="row-detail-cell" colspan="10">${renderEliteRowDetails(rec)}</td>
          </tr>` : ""}
        `;
        }).join("");

        const staticItems = [
          [homeName(match), `世界排名：${formatWorldRanking(match.homeTeam)}`],
          [awayName(match), `世界排名：${formatWorldRanking(match.awayTeam)}`],
          ...match.homeTeam.staticSignals.map((signal) => [`${homeName(match)}`, signal]),
          ...match.awayTeam.staticSignals.map((signal) => [`${awayName(match)}`, signal])
        ];

        const watchItems = [
          ...match.homeTeam.watchItems.map((item) => [`${homeName(match)}`, item]),
          ...match.awayTeam.watchItems.map((item) => [`${awayName(match)}`, item])
        ];

        return `
          <article class="match-card" data-match="${escapeHtml(match.id)}">
            <div class="match-header">
              <div class="teams">
                <h3>${escapeHtml(homeName(match))} vs ${escapeHtml(awayName(match))}</h3>
                <div class="meta-line">${escapeHtml(match.group)} 组 · ${escapeHtml(match.venue)} · 北京时间 ${fmtTime(match.kickoffShanghai)}</div>
              </div>
              <span class="badge">${match.autoBaseline ? "赛程自动基线" : `第 ${escapeHtml(match.matchday)} 比赛日`}</span>
            </div>

            ${renderAiPrediction(match)}
            ${renderTournamentTrend(match)}
            ${renderAiTradePlan(match)}

            ${renderOddsBoard(match)}

            <div class="tabs" role="tablist">
              <button class="tab active" data-tab="live">实时买点</button>
              <button class="tab" data-tab="rec">建议</button>
              <button class="tab" data-tab="static">比赛情报</button>
              <button class="tab" data-tab="elite">高手</button>
              <button class="tab" data-tab="leaderboard">榜单</button>
              <button class="tab" data-tab="intel">静态</button>
              <button class="tab" data-tab="dynamic">动态</button>
              <button class="tab" data-tab="market">盘口</button>
            </div>

            <div class="tab-content" data-content="rec">
              <div class="recommendations">
                <table>
                  <thead>
                    <tr>
                      <th>类型</th>
                      <th>市场</th>
                      <th class="numeric">模型</th>
                      <th class="numeric">走水</th>
                      <th class="numeric">盘口</th>
                      <th>传统赔率</th>
                      <th class="numeric">Edge</th>
                      <th class="numeric">建议买价≤</th>
                      <th>曲线</th>
                      <th>动作</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>

            <div class="tab-content active" data-content="live">
              ${renderLiveInsight(match)}
            </div>

            <div class="tab-content" data-content="intel">
              ${renderMatchIntel(match)}
            </div>

            <div class="tab-content" data-content="elite">
              ${renderEliteSignals(match)}
            </div>

            <div class="tab-content" data-content="leaderboard">
              ${renderBettingExpert(match)}
            </div>

            <div class="tab-content" data-content="static">
              ${renderStaticInfo(match, staticItems)}
            </div>

            <div class="tab-content" data-content="dynamic">
              <ul class="info-list">
                <li><strong>状态</strong><span>${escapeHtml(match.dynamic.status)}</span></li>
                <li><strong>伤病</strong><span>${escapeHtml(match.dynamic.injurySummary)}</span></li>
                <li><strong>天气</strong><span>${escapeHtml(match.dynamic.weatherSummary)}</span></li>
                <li><strong>首发信心</strong><span>${escapeHtml(match.dynamic.lineupConfidence)}</span></li>
                ${match.tournamentTrend?.notes?.length ? `<li><strong>本届趋势</strong><span>${escapeHtml(match.tournamentTrend.notes.join(" "))}</span></li>` : ""}
                ${watchItems.map(([team, item]) => `<li><strong>${escapeHtml(team)}</strong><span>${escapeHtml(item)}</span></li>`).join("")}
              </ul>
            </div>

            <div class="tab-content" data-content="market">
              ${renderMarketCatalog(match.marketCatalog)}
              <ul class="info-list">
                ${match.autoBaseline ? '<li><strong>基线状态</strong><span>已纳入三天赛程窗口，并用保守球队评分生成基础概率；缺少真实盘口或动态情报时，只显示观察，不给价格建议。</span></li>' : ""}
                ${match.scheduleStatusDetail || match.scheduleStatus ? `<li><strong>比赛状态</strong><span>${escapeHtml(match.scheduleStatusDetail || match.scheduleStatus)}</span></li>` : ""}
                ${match.scheduleSource ? `<li><strong>赛程来源</strong><span>${escapeHtml(match.scheduleSource)}</span></li>` : ""}
                <li><strong>盘口来源</strong><span>${escapeHtml(match.manualMarkets.source)}</span></li>
                <li><strong>盘口更新时间</strong><span>${fmtTime(match.manualMarkets.lastUpdated)}</span></li>
                ${match.manualMarkets.advance?.available ? `<li><strong>晋级</strong><span>${escapeHtml(homeName(match))} ${fmtPrice(match.manualMarkets.advance?.home)} / ${escapeHtml(awayName(match))} ${fmtPrice(match.manualMarkets.advance?.away)} · Team to Advance 包含加时/点球，不等于90分钟胜平负</span></li>` : ""}
                <li><strong>胜平负</strong><span>${escapeHtml(homeName(match))} ${fmtPrice(match.manualMarkets.moneyline?.home)} / 平局 ${fmtPrice(match.manualMarkets.moneyline?.draw)} / ${escapeHtml(awayName(match))} ${fmtPrice(match.manualMarkets.moneyline?.away)}</span></li>
                <li><strong>大小球</strong><span>小于 2.5 球 ${fmtPrice(match.manualMarkets.totals?.under25)} / 大于 2.5 球 ${fmtPrice(match.manualMarkets.totals?.over25)}</span></li>
                <li><strong>双方进球</strong><span>是 ${fmtPrice(match.manualMarkets.btts?.yes)} / 否 ${fmtPrice(match.manualMarkets.btts?.no)} · 模型 ${fmtPct(match.probabilities.btts)}</span></li>
                <li><strong>模型 xG</strong><span>${match.model.lambdaHome.toFixed(2)} - ${match.model.lambdaAway.toFixed(2)}</span></li>
                <li><strong>常见比分</strong><span>${match.probabilities.topScores.map((s) => `${s.score} ${(s.probability * 100).toFixed(1)}%`).join(", ")}</span></li>
                ${match.tournamentTrend?.applied ? `<li><strong>趋势修正</strong><span>${escapeHtml(match.tournamentTrend.notes.join(" "))}</span></li>` : ""}
                ${(match.recommendations || []).filter((rec) => rec.marketType === "handicap").map((rec) => `<li><strong>让球盘</strong><span>${escapeHtml(rec.name)} @ ${fmtPrice(rec.marketPrice)} · ${escapeHtml(fmtOdds(rec.odds))} · 模型 ${fmtPct(rec.modelProbability)}</span></li>`).join("")}
                ${match.model.manualAdjustments.map((adj) => `<li><strong>${escapeHtml(adj.label)}</strong><span>${escapeHtml(adj.impact)}</span></li>`).join("")}
              </ul>
            </div>
          </article>
        `;
      }

      function renderMatchTabs(matches) {
        const matchdayMatches = focusMatchdayMatches(matches);
        if (!matchdayMatches.length) {
          return `<div class="empty">${escapeHtml(currentLang === "en"
            ? "No match is available for the current matchday."
            : "当前比赛日没有可显示的比赛。")}</div>`;
        }
        const focusDate = matchShanghaiDateKey(matchdayMatches[0]);
        const tabs = matchdayMatches.map((match, index) => {
          const hasLive = livePolymarketRecommendations(match).length > 0;
          const statusLabel = hasLive
            ? (currentLang === "en" ? "Polymarket live" : "Polymarket 实时盘")
            : (currentLang === "en" ? "Schedule / awaiting market" : "赛程 / 待盘口");
          return `
          <button class="match-tab ${index === 0 ? "active" : ""}" data-match-tab="${escapeHtml(match.id)}" type="button">
            <span class="match-tab-title">${escapeHtml(homeName(match))} vs ${escapeHtml(awayName(match))}</span>
            <span class="match-tab-meta">${escapeHtml(statusLabel)} · ${fmtTime(match.kickoffShanghai)}</span>
          </button>
        `;
        }).join("");

        const panels = matchdayMatches.map((match, index) => `
          <div class="match-panel ${index === 0 ? "active" : ""}" data-match-panel="${escapeHtml(match.id)}">
            ${renderMatch(match)}
          </div>
        `).join("");

        return `
          <div class="confidence-note">${escapeHtml(currentLang === "en" ? "Matchday" : "当前比赛日")} ${escapeHtml(focusDate || "-")}</div>
          <div class="match-switcher" role="tablist" aria-label="比赛切换">
            ${tabs}
          </div>
          <div class="match-panels">
            ${panels}
          </div>
        `;
      }

      function wireMatchTabs() {
        const root = document.getElementById("matches");
        root.querySelectorAll(".match-tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            const id = tab.dataset.matchTab;
            root.querySelectorAll(".match-tab").forEach((item) => item.classList.toggle("active", item === tab));
            root.querySelectorAll(".match-panel").forEach((panel) => {
              panel.classList.toggle("active", panel.dataset.matchPanel === id);
            });
            drawBigCharts(root);
            refreshVisibleLiveMatch();
          });
        });
      }

      function wireTabs() {
        document.querySelectorAll(".match-card").forEach((card) => {
          card.querySelectorAll(".tab").forEach((tab) => {
            tab.addEventListener("click", () => {
              const target = tab.dataset.tab;
              card.querySelectorAll(".tab").forEach((item) => item.classList.toggle("active", item === tab));
              card.querySelectorAll(".tab-content").forEach((content) => {
                content.classList.toggle("active", content.dataset.content === target);
              });
              if (target === "live") {
                const matchId = card.dataset.match;
                if (matchId && !liveMatchStates.has(matchId)) refreshLiveMatch(matchId);
              }
            });
          });
        });
      }

      function wireLivePanels() {
        document.querySelectorAll("[data-live-refresh]").forEach((button) => {
          button.addEventListener("click", () => {
            refreshLiveMatch(button.dataset.liveRefresh, true);
          });
        });
      }

      function updateLivePanel(matchId) {
        const panel = Array.from(document.querySelectorAll("[data-live-match]")).find((item) => item.dataset.liveMatch === matchId);
        const container = panel?.closest("[data-content='live']");
        if (!container) return;
        const match = (currentDashboard?.matches || []).find((item) => item.id === matchId);
        if (!match) return;
        container.innerHTML = renderLiveInsight(match);
        wireLivePanels();
        wireOddsTabs();
      }

      function refreshVisibleLiveMatch() {
        const activePanel = document.querySelector(".match-panel.active");
        const card = activePanel?.querySelector(".match-card[data-match]");
        const matchId = card?.dataset.match;
        if (matchId && !liveMatchStates.has(matchId)) refreshLiveMatch(matchId);
      }

      async function refreshLiveMatch(matchId, force = false) {
        if (!matchId || liveMatchLoading.has(matchId)) return;
        liveMatchLoading.add(matchId);
        liveMatchStates.set(matchId, { loading: true });
        updateLivePanel(matchId);
        try {
          const params = new URLSearchParams({ matchId });
          if (force) params.set("force", "1");
          const response = await fetch(`${basePath()}api/live/match?${params.toString()}`, { cache: "no-store" });
          const payload = await response.json();
          liveMatchStates.set(matchId, payload);
        } catch (error) {
          liveMatchStates.set(matchId, { ok: false, error: error.message });
        } finally {
          liveMatchLoading.delete(matchId);
          updateLivePanel(matchId);
        }
      }

      function wireOddsTabs() {
        document.querySelectorAll(".odds-board").forEach((board) => {
          board.querySelectorAll(".odds-board-tab").forEach((tab) => {
            tab.addEventListener("click", () => {
              const target = tab.dataset.oddsTab;
              board.querySelectorAll(".odds-board-tab").forEach((item) => item.classList.toggle("active", item === tab));
              board.querySelectorAll(".odds-board-panel").forEach((panel) => {
                panel.classList.toggle("active", panel.dataset.oddsPanel === target);
              });
              drawBigCharts(board);
            });
          });
        });
        document.querySelectorAll(".market-catalog").forEach((catalog) => {
          catalog.querySelectorAll(".market-catalog-tab").forEach((tab) => {
            tab.addEventListener("click", () => {
              const target = tab.dataset.marketCatalogTab;
              catalog.querySelectorAll(".market-catalog-tab").forEach((item) => item.classList.toggle("active", item === tab));
              catalog.querySelectorAll(".market-catalog-panel").forEach((panel) => {
                panel.classList.toggle("active", panel.dataset.marketCatalogPanel === target);
              });
            });
          });
        });
      }

      function wireRecommendationRows() {
        document.querySelectorAll(".recommendation-main-row.expandable").forEach((row) => {
          const toggle = () => {
            const detail = document.getElementById(row.dataset.detailId);
            if (!detail) return;
            const open = row.getAttribute("aria-expanded") === "true";
            row.setAttribute("aria-expanded", open ? "false" : "true");
            row.classList.toggle("expanded", !open);
            detail.hidden = open;
            if (!open) drawSparklines(detail);
          };
          row.addEventListener("click", (event) => {
            if (event.target.closest("a, button, canvas")) return;
            toggle();
          });
          row.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            toggle();
          });
        });
      }

      function renderDashboard(data) {
        currentDashboard = data;
        applyLanguageStatic();
        document.getElementById("subhead").textContent = currentLang === "en"
          ? `${data.meta.tournament} · ${data.meta.timezone}`
          : `${data.meta.tournament} · ${data.meta.timezone}`;
        document.getElementById("lastUpdate").textContent = currentLang === "en"
          ? `Generated ${fmtTime(data.meta.generatedAt)} · Intelligence ${fmtTime(data.contextMeta?.lastUpdated)} · Local baseline ${fmtTime(data.meta.lastManualUpdate)}`
          : `生成 ${fmtTime(data.meta.generatedAt)} · 情报 ${fmtTime(data.contextMeta?.lastUpdated)} · 本地基线 ${fmtTime(data.meta.lastManualUpdate)}`;
        renderSources(data.sources);
        renderPolymarket(data.polymarket);
        renderEliteTradersPanel(data.eliteTraders);
        document.getElementById("matches").innerHTML = renderMatchTabs(data.matches);
        translateRenderedContent(document.body);
        wireMatchTabs();
        wireTabs();
        wireLivePanels();
        wireOddsTabs();
        wireRecommendationRows();
        drawSparklines(document.getElementById("matches"));
        drawBigCharts(document.getElementById("matches"));
        refreshVisibleLiveMatch();
      }

      async function loadDashboard(force = false) {
        const button = document.getElementById("refresh");
        button.disabled = true;
        try {
          if (window.location.protocol === "file:") {
            throw new Error("当前是 file:// 打开的静态文件，请通过 Node 服务或远端 /worldcup/ 访问页面，否则 API 数据无法加载。");
          }
          const params = new URLSearchParams({
            light: "1",
            skipHistory: "1"
          });
          if (force) params.set("force", "1");
          const apiPath = `${basePath()}api/dashboard?${params.toString()}`;
          const response = await fetch(apiPath, { cache: "no-store" });
          const data = await response.json();
          window.dashboardResearchFramework = data.researchFramework || {};
          renderDashboard(data);
        } catch (error) {
          const message = currentLang === "en" ? `Load failed: ${error.message}` : `加载失败：${error.message}`;
          document.getElementById("matches").innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        } finally {
          button.disabled = false;
        }
      }

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });
      document.getElementById("refresh").addEventListener("click", () => {
        loadDashboard(true);
        loadOpportunities(true);
        loadOpportunityReview(true);
        loadOpportunityElites(true);
      });
      document.getElementById("opportunityButton").addEventListener("click", () => {
        const modal = document.getElementById("opportunityModal");
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      });
      document.querySelectorAll("[data-opportunity-tab]").forEach((tab) => {
        tab.addEventListener("click", () => setOpportunityTab(tab.dataset.opportunityTab));
      });
      document.getElementById("opportunityClose").addEventListener("click", () => {
        const modal = document.getElementById("opportunityModal");
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
      });
      document.getElementById("opportunityList").addEventListener("click", (event) => {
        const card = event.target.closest("[data-opportunity-id]");
        if (!card) return;
        checkOpportunityPrice(card.dataset.opportunityId);
      });
      document.getElementById("opportunityList").addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-opportunity-id]");
        if (!card) return;
        event.preventDefault();
        checkOpportunityPrice(card.dataset.opportunityId);
      });
      document.getElementById("opportunityModal").addEventListener("click", (event) => {
        if (event.target.id !== "opportunityModal") return;
        event.currentTarget.classList.remove("open");
        event.currentTarget.setAttribute("aria-hidden", "true");
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        const modal = document.getElementById("opportunityModal");
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
      });
      applyLanguageStatic();
      loadDashboard();
      loadOpportunities();
      setInterval(() => loadDashboard(false), 5 * 60 * 1000);
      setInterval(() => loadOpportunities(false), 5 * 60 * 1000);
      setInterval(() => renderOpportunities(currentOpportunities), 60 * 1000);
    </script>
  </body>
</html>

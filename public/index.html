<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup Match Intelligence Dashboard</title>
    <style>
      :root {
        --bg: #f6f7f2;
        --panel: #ffffff;
        --ink: #18201d;
        --muted: #66706b;
        --line: #d9dfd8;
        --green: #147d64;
        --red: #b83a35;
        --amber: #a26213;
        --blue: #245a9c;
        --shadow: 0 12px 32px rgba(31, 45, 38, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 28px;
        border-bottom: 1px solid var(--line);
        background: rgba(246, 247, 242, 0.94);
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: linear-gradient(135deg, #1f6b54, #d5b86c);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .subhead {
        margin-top: 2px;
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .language-toggle {
        display: inline-flex;
        align-items: center;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .language-toggle button {
        min-width: 44px;
        height: 32px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 750;
      }

      .language-toggle button.active {
        background: #e8f2ee;
        color: var(--green);
      }

      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }

      .icon-button:hover {
        border-color: #9fb0a8;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 22px;
        padding: 24px 28px 42px;
      }

      .main {
        min-width: 0;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 0 0 12px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 17px;
        line-height: 1.2;
      }

      .last-update {
        color: var(--muted);
        font-size: 12px;
      }

      .match-grid {
        display: block;
      }

      .match-switcher {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .match-tab {
        flex: 0 0 auto;
        min-width: 178px;
        max-width: 240px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .match-tab.active {
        border-color: #1f6b54;
        background: #e8f2ee;
      }

      .match-tab-title {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 750;
      }

      .match-tab-meta {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .match-panels {
        display: grid;
        gap: 16px;
      }

      .match-panel {
        display: none;
      }

      .match-panel.active {
        display: block;
      }

      .match-card,
      .side-panel,
      .source-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .match-card {
        padding: 16px;
      }

      .match-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .teams {
        min-width: 0;
      }

      .teams h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
      }

      .meta-line {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 8px;
        border-radius: 999px;
        background: #eef3ef;
        color: #2d493c;
        font-size: 12px;
        white-space: nowrap;
      }

      .confidence-panel {
        display: grid;
        grid-template-columns: minmax(220px, 0.85fr) minmax(0, 1.15fr);
        gap: 12px;
        margin: 14px 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .mode-card {
        min-width: 0;
      }

      .mode-label {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 8px;
        border-radius: 6px;
        background: #eef3ef;
        color: #2d493c;
        font-size: 12px;
        font-weight: 750;
      }

      .mode-label.low {
        background: #fff3dd;
        color: var(--amber);
      }

      .mode-label.high {
        background: #e2f3ec;
        color: var(--green);
      }

      .confidence-score {
        margin-top: 8px;
        font-size: 28px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .prediction-result {
        margin-top: 8px;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.15;
      }

      .prediction-prob {
        margin-top: 4px;
        color: var(--green);
        font-size: 28px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .prediction-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 10px;
      }

      .prediction-prob-card {
        min-width: 0;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .prediction-prob-card strong {
        display: block;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
      }

      .prediction-prob-card span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .prediction-row-label {
        display: block;
        font-weight: 760;
        font-size: 13px;
        line-height: 1.25;
      }

      .prediction-market-line {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .prediction-edge {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        font-weight: 760;
      }

      .prediction-edge.good {
        color: var(--green);
      }

      .prediction-edge.bad {
        color: var(--red);
      }

      .prediction-reasons {
        display: grid;
        gap: 6px;
        margin: 0;
        padding-left: 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .confidence-note {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .completeness-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .data-chip {
        min-width: 0;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .data-chip-name {
        color: var(--muted);
        font-size: 12px;
      }

      .data-chip-status {
        margin-top: 3px;
        font-size: 13px;
        font-weight: 750;
      }

      .data-chip-status.synced {
        color: var(--green);
      }

      .data-chip-status.stale {
        color: var(--amber);
      }

      .data-chip-status.missing {
        color: var(--red);
      }

      .odds-board {
        margin: 16px 0 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .odds-board-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .odds-board-title {
        font-size: 15px;
        font-weight: 750;
      }

      .odds-board-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .odds-board-tabs,
      .odds-market-row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .odds-board-tabs {
        margin-bottom: 10px;
      }

      .odds-board-tab {
        flex: 0 0 auto;
        height: 32px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
      }

      .odds-board-tab.active {
        border-color: #1f6b54;
        background: #e8f2ee;
        color: #164b3c;
      }

      .odds-board-panel {
        display: none;
      }

      .odds-board-panel.active {
        display: block;
      }

      .odds-pill {
        flex: 1 0 136px;
        min-width: 136px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .odds-pill-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      .odds-pill-price {
        font-size: 17px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .odds-pill-detail {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 11px;
      }

      .odds-chart-wrap {
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
        padding: 10px;
      }

      .odds-big-chart {
        width: 100%;
        height: 260px;
        display: block;
      }

      .tabs {
        display: flex;
        gap: 6px;
        margin: 12px 0;
      }

      .tab {
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
      }

      .tab.active {
        border-color: #1f6b54;
        background: #e8f2ee;
        color: #164b3c;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .info-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .info-list li {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 8px 0;
        border-bottom: 1px solid #edf0ec;
        color: var(--muted);
        font-size: 13px;
      }

      .info-list li:last-child {
        border-bottom: 0;
      }

      .info-list strong {
        color: var(--ink);
        font-weight: 650;
      }

      .static-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 12px;
      }

      .static-block {
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .static-block.wide {
        grid-column: 1 / -1;
      }

      .static-block h4 {
        margin: 0 0 8px;
        font-size: 14px;
      }

      .h2h-summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 8px;
      }

      .h2h-stat {
        min-width: 0;
        padding: 9px;
        border: 1px solid #e6ebe7;
        border-radius: 8px;
        background: #fff;
      }

      .h2h-stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .h2h-stat strong {
        display: block;
        margin-top: 3px;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
      }

      .intel-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .intel-block {
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .intel-block.wide {
        grid-column: 1 / -1;
      }

      .intel-block h4 {
        margin: 0 0 8px;
        font-size: 14px;
      }

      .lineup-box {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .lineup-team {
        min-width: 0;
        padding: 10px;
        border: 1px solid #e6ebe7;
        border-radius: 8px;
        background: #fff;
      }

      .lineup-team-title {
        font-weight: 750;
      }

      .lineup-meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .lineup-list {
        margin: 8px 0 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .framework-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .framework-item {
        padding: 9px;
        border: 1px solid #e6ebe7;
        border-radius: 8px;
        background: #fff;
      }

      .framework-item strong {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
      }

      .framework-item span {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .elite-summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }

      .elite-stat {
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .elite-stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .elite-stat strong {
        display: block;
        margin-top: 4px;
        font-size: 19px;
        font-variant-numeric: tabular-nums;
      }

      .elite-board {
        display: grid;
        gap: 8px;
      }

      .elite-card {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .elite-rank {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #e8f2ee;
        color: #164b3c;
        font-size: 12px;
        font-weight: 800;
      }

      .elite-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 750;
        font-size: 13px;
      }

      .elite-wallet {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .elite-metrics {
        text-align: right;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
        white-space: nowrap;
      }

      .elite-signal-list {
        display: grid;
        gap: 10px;
      }

      .elite-signal {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .elite-signal-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
      }

      .elite-signal-market {
        min-width: 0;
        font-weight: 750;
        font-size: 13px;
      }

      .elite-signal-meta {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .elite-position-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .elite-position-table th,
      .elite-position-table td {
        padding: 7px 6px;
      }

      .elite-chip {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 7px;
        border-radius: 6px;
        background: #edf0ef;
        color: #59645f;
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
      }

      .elite-chip.hot {
        background: #e2f3ec;
        color: var(--green);
      }

      .elite-summary-trigger {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .elite-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        font-size: 11px;
      }

      .elite-inline-list {
        display: grid;
        gap: 7px;
      }

      .elite-inline-card {
        padding: 8px;
        border: 1px solid #e6ebe7;
        border-radius: 8px;
        background: #fff;
      }

      .elite-inline-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        font-weight: 750;
      }

      .elite-inline-meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .recommendations {
        overflow-x: auto;
      }

      .recommendation-main-row.expandable {
        cursor: pointer;
      }

      .recommendation-main-row.expandable:hover td {
        background: #fbfcfa;
      }

      .recommendation-main-row.expanded td {
        background: #f8fbf8;
      }

      .recommendation-main-row.expanded .elite-arrow {
        transform: rotate(90deg);
      }

      .market-cell-main {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .row-detail-cell {
        padding: 0;
        background: #fbfcfa;
      }

      .row-detail-panel {
        padding: 12px;
        border-bottom: 1px solid #edf0ec;
      }

      .row-detail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 12px;
      }

      .row-detail-title {
        font-weight: 760;
      }

      .row-detail-meta {
        color: var(--muted);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 9px 8px;
        text-align: left;
        border-bottom: 1px solid #edf0ec;
        vertical-align: middle;
      }

      th {
        color: var(--muted);
        font-weight: 650;
        white-space: nowrap;
      }

      td.numeric,
      th.numeric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .decision {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        padding: 0 8px;
        border-radius: 6px;
        font-weight: 650;
        white-space: nowrap;
      }

      .decision.BUY,
      .decision.BUY_SMALL {
        background: #e2f3ec;
        color: var(--green);
      }

      .decision.WATCH {
        background: #f8edda;
        color: var(--amber);
      }

      .decision.AVOID_OR_SELL {
        background: #f8e5e3;
        color: var(--red);
      }

      .decision.NO_TRADE,
      .decision.WAIT,
      .decision.BASELINE {
        background: #edf0ef;
        color: #59645f;
      }

      .decision-note {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .sidebar {
        display: grid;
        gap: 16px;
        align-content: start;
      }

      .side-panel {
        padding: 16px;
      }

      .side-panel h2,
      .source-card h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .source-card {
        padding: 14px;
      }

      .source-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #edf0ec;
      }

      .source-row:last-child {
        border-bottom: 0;
      }

      .source-name {
        font-weight: 650;
      }

      .source-detail {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .status {
        min-width: 62px;
        text-align: center;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
      }

      .status.ok {
        background: #e2f3ec;
        color: var(--green);
      }

      .status.fail {
        background: #f8e5e3;
        color: var(--red);
      }

      .market-list {
        display: grid;
        gap: 10px;
      }

      .market-item {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfa;
      }

      .market-question {
        font-size: 13px;
        font-weight: 650;
        line-height: 1.35;
      }

      .market-meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .token-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .token-row {
        display: grid;
        grid-template-columns: minmax(84px, 1fr) 58px 120px;
        align-items: center;
        gap: 8px;
      }

      .token-name {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .token-price {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        font-weight: 700;
      }

      .sparkline {
        width: 120px;
        height: 34px;
        border: 1px solid #e6ebe7;
        border-radius: 6px;
        background: #fff;
      }

      .market-sparkline {
        width: 148px;
        height: 38px;
      }

      .chart-cell {
        min-width: 158px;
      }

      .chart-source {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .empty,
      .error {
        padding: 14px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .error {
        border-color: #e6b7b4;
        color: var(--red);
        background: #fff8f7;
      }

      .note {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 1100px) {
        .content {
          grid-template-columns: 1fr;
        }

        .sidebar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 760px) {
        .topbar {
          align-items: flex-start;
          padding: 16px;
        }

        .content {
          padding: 16px;
        }

          grid-template-columns: 1fr;
        }

        .confidence-panel,

        .elite-summary-grid,
        .completeness-grid {
          grid-template-columns: 1fr;
        }

          font-size: 18px;

      function translateText(text) {
        if (currentLang !== "en" || !text) return text;
        let output = String(text);
        if (UI_TRANSLATIONS[output]) return UI_TRANSLATIONS[output];
        for (const [from, to] of Object.entries(UI_TRANSLATIONS)) {
          output = output.split(from).join(to);
        }
        for (const [pattern, replacement] of UI_REGEX_TRANSLATIONS) {
          output = output.replace(pattern, replacement);
        }
        return output;
      }

        const refresh = document.getElementById("refresh");
        refresh.title = labels.refreshTitle;
        refresh.setAttribute("aria-label", labels.refreshTitle);
        document.querySelectorAll("[data-lang]").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === currentLang);
        });
      }

      function translateRenderedContent(scope = document) {
        if (currentLang !== "en") return;
        const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            const parent = node.parentElement;
            if (!parent || ["SCRIPT", "STYLE", "CANVAS"].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach((node) => {
          node.nodeValue = translateText(node.nodeValue);
        });
        scope.querySelectorAll("[title], [aria-label]").forEach((item) => {
          if (item.hasAttribute("title")) item.setAttribute("title", translateText(item.getAttribute("title")));
          if (item.hasAttribute("aria-label")) item.setAttribute("aria-label", translateText(item.getAttribute("aria-label")));
        });
      }

      function setLanguage(lang) {
        currentLang = lang === "en" ? "en" : "zh";
        localStorage.setItem("worldcup-dashboard-lang", currentLang);
        applyLanguageStatic();
        if (currentDashboard) renderDashboard(currentDashboard);

      const fmtPct = (value) => {
        if (typeof value !== "number") return "-";
        return `${(value * 100).toFixed(1)}%`;

      const fmtPrice = (value) => {
        if (typeof value !== "number") return "-";
        return value.toFixed(2);

      function formatWorldRanking(team) {
        const ranking = team?.worldRanking;
        if (!ranking?.rank) return "未同步";
        const updated = ranking.updatedAt ? ` · ${ranking.updatedAt} 更新` : "";
        const source = ranking.source ? ` · ${ranking.source}` : "";
        return `FIFA 男足第 ${ranking.rank}${updated}${source}`;
      }

      function formatH2hWindow(headToHead) {
        if (!headToHead?.windowStart || !headToHead?.windowEnd) return "未同步";
        return `${headToHead.windowStart} - ${headToHead.windowEnd}`;
      }

      function formatH2hRecord(match, headToHead) {
        const summary = headToHead?.summary || {};
        return `${homeName(match)} ${summary.homeWins || 0} / 平 ${summary.draws || 0} / ${awayName(match)} ${summary.awayWins || 0}`;
      }

      function formatH2hGoals(match, headToHead) {
        const summary = headToHead?.summary || {};
        return `${homeName(match)} ${summary.homeGoals || 0} - ${summary.awayGoals || 0} ${awayName(match)}`;
      }

        const headToHead = match.headToHead || {};
        const summary = headToHead.summary || {};
        const meetings = Array.isArray(headToHead.latestMeetings) ? headToHead.latestMeetings : [];
        const sources = Array.isArray(headToHead.sources) ? headToHead.sources : [];
        return `

              <div class="h2h-stat"><span>总场次</span><strong>${escapeHtml(summary.matches || 0)}</strong></div>

        return `${sign}$${abs.toFixed(0)}`;

      function drawSparklines(scope = document) {
        scope.querySelectorAll(".sparkline").forEach((canvas) => {
          let points = [];
          try {
            points = JSON.parse(decodeURIComponent(canvas.dataset.series || "[]"));
          } catch {
            points = [];
          }
          const ctx = canvas.getContext("2d");
          const width = canvas.width;
          const height = canvas.height;
          ctx.clearRect(0, 0, width, height);
          ctx.strokeStyle = "#d9dfd8";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, height - 1);
          ctx.lineTo(width, height - 1);
          ctx.stroke();

          if (!points.length) {
            ctx.fillStyle = "#8b958f";
            ctx.font = "11px system-ui, sans-serif";
            ctx.fillText("无曲线", 40, 21);
            return;
          }

          const prices = points.map((point) => point.p);
          const min = Math.min(...prices, 0);
          const max = Math.max(...prices, 1);
          const span = Math.max(0.01, max - min);
          ctx.strokeStyle = "#147d64";
          ctx.lineWidth = 2;
          ctx.beginPath();
          points.forEach((point, index) => {
            const x = points.length === 1 ? width - 2 : (index / (points.length - 1)) * (width - 4) + 2;
            const y = height - 4 - ((point.p - min) / span) * (height - 8);
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        });
      }

      const chartColors = ["#147d64", "#245a9c", "#a26213", "#b83a35", "#6b7280", "#7c3aed"];

      function drawBigCharts(scope = document) {
        scope.querySelectorAll(".odds-big-chart").forEach((canvas) => {
          let series = [];
          try {
            series = JSON.parse(decodeURIComponent(canvas.dataset.series || "[]"));
          } catch {
            series = [];
          }
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const width = Math.max(320, Math.round(rect.width || 760));
          const height = Math.max(220, Math.round(rect.height || 260));
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          const ctx = canvas.getContext("2d");
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, width, height);

          const pad = { left: 42, right: 48, top: 18, bottom: 30 };
          const plotW = width - pad.left - pad.right;
          const plotH = height - pad.top - pad.bottom;
          ctx.fillStyle = "#fbfcfa";
          ctx.fillRect(0, 0, width, height);

          const values = series.flatMap((item) => (item.history || []).map((point) => point.p));
          if (!values.length) {
            ctx.fillStyle = "#66706b";
            ctx.font = "13px system-ui, sans-serif";
            ctx.fillText("暂无历史曲线，等待盘口快照更新", pad.left, pad.top + 24);
            return;
          }

          const minY = Math.max(0, Math.min(...values) - 0.04);
          const maxY = Math.min(1, Math.max(...values) + 0.04);
          const spanY = Math.max(0.01, maxY - minY);
          const times = series.flatMap((item) => (item.history || []).map((point) => point.t));
          const minT = Math.min(...times);
          const maxT = Math.max(...times);
          const spanT = Math.max(1, maxT - minT);

          ctx.strokeStyle = "#d9dfd8";
          ctx.lineWidth = 1;
          ctx.font = "12px system-ui, sans-serif";
          ctx.fillStyle = "#66706b";
          [0, 0.25, 0.5, 0.75, 1].forEach((ratio) => {
            const y = pad.top + plotH * ratio;
            ctx.beginPath();
            ctx.moveTo(pad.left, y);
            ctx.lineTo(width - pad.right, y);
            ctx.stroke();
            const label = `${Math.round((maxY - spanY * ratio) * 100)}%`;
            ctx.fillText(label, width - pad.right + 8, y + 4);
          });

          series.forEach((item, index) => {
            const history = item.history || [];
            if (!history.length) return;
            const color = chartColors[index % chartColors.length];
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            history.forEach((point, pointIndex) => {
              const x = pad.left + ((point.t - minT) / spanT) * plotW;
              const y = pad.top + (1 - (point.p - minY) / spanY) * plotH;
              if (pointIndex === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();

            const last = history[history.length - 1];
            const lastX = pad.left + ((last.t - minT) / spanT) * plotW;
            const lastY = pad.top + (1 - (last.p - minY) / spanY) * plotH;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
            ctx.fill();
          });
        });
      }

              <h4>AI 综合分析</h4>
              <ul class="info-list">
                <li><strong>状态</strong><span>${ai.ok ? `已分析 · ${escapeHtml(ai.model || "")}` : escapeHtml(ai.error || "未启用")}</span></li>
                <li><strong>结论</strong><span>${escapeHtml(ai.summary || "等待服务器配置 OPENAI_API_KEY 后定时综合。")}</span></li>
                ${riskFlags.length ? `<li><strong>风险点</strong><span>${escapeHtml(riskFlags.join(" / "))}</span></li>` : ""}
              </ul>
            </section>

            <section class="intel-block wide">
              <h4>动态信息对模型的影响</h4>
              <ul class="info-list">
                <li><strong>基线 xG</strong><span>${dynamicModel.base.lambdaHome.toFixed(2)} - ${dynamicModel.base.lambdaAway.toFixed(2)}</span></li>
                <li><strong>动态 xG</strong><span>${dynamicModel.adjusted.lambdaHome.toFixed(2)} - ${dynamicModel.adjusted.lambdaAway.toFixed(2)}</span></li>
                ${impacts.length ? impacts.map((impact) => `<li><strong>${escapeHtml(impact.label)}</strong><span>${escapeHtml(impact.reason)} · xG ${impact.homeXgDelta > 0 ? "+" : ""}${impact.homeXgDelta.toFixed(2)} / ${impact.awayXgDelta > 0 ? "+" : ""}${impact.awayXgDelta.toFixed(2)}</span></li>`).join("") : '<li><strong>调整</strong><span>暂无可确认动态调整，维持基线模型。</span></li>'}
              </ul>
            </section>

            <section class="intel-block wide">
              <h4>研究框架维度</h4>
              ${renderResearchFramework(window.dashboardResearchFramework)}
            </section>

            <section class="intel-block wide">
              <h4>来源和置信度</h4>
              <ul class="info-list">
                <li><strong>情报更新时间</strong><span>${fmtTime(context.updatedAt)}</span></li>
                ${sourceRows || '<li><strong>来源</strong><span>未同步</span></li>'}
              </ul>
            </section>
          </div>
        `;
      }

      function renderEliteSignals(match) {
        const summary = match.eliteSummary || {};
        const rows = (match.recommendations || []).filter((rec) => rec.eliteSummary?.count > 0 || rec.holderSummary?.count > 0);
        const updated = summary.updatedAt ? fmtTime(summary.updatedAt) : "-";
        const sourceText = summary.source || "Polymarket Data API /v1/market-positions";
        return `
          <div class="elite-summary-grid">
            <div class="elite-stat"><span>当前盘口高手持仓</span><strong>${escapeHtml(summary.activePositions || 0)}</strong></div>
            <div class="elite-stat"><span>涉及高手账号</span><strong>${escapeHtml(summary.activeTraders || 0)}</strong></div>
            <div class="elite-stat"><span>顶级持仓者</span><strong>${escapeHtml(summary.topHolderPositions || 0)}</strong></div>
            <div class="elite-stat"><span>当前价值 / 累计参与</span><strong>${fmtMoney(summary.totalCurrentValue || 0)} / ${fmtMoney(summary.totalBought || 0)}</strong></div>
          </div>
          <ul class="info-list">
            <li><strong>数据口径</strong><span>顶级持仓者来自当前 token 的公开 holder 列表；高手标记表示该账号同时命中足球表现 Top 100。</span></li>
            <li><strong>来源</strong><span>${escapeHtml(sourceText)} · ${updated}</span></li>
          </ul>
          <div class="elite-signal-list">
            ${rows.length ? rows.map((rec) => `
              <section class="elite-signal">
                <div class="elite-signal-head">
                  <div class="elite-signal-market">${escapeHtml(rec.name)} · ${escapeHtml(rec.marketTypeLabel || "")}</div>
                  <div class="elite-signal-meta">持仓 ${escapeHtml(rec.holderSummary?.count || 0)} 人 · 高手 ${escapeHtml(rec.eliteSummary?.count || 0)} 人 · 份额 ${fmtShares(rec.holderSummary?.totalShares || 0)}</div>
                </div>
                <table class="elite-position-table">
                  <thead>
                    <tr>
                      <th>账号</th>
                      <th class="numeric">份额</th>
                      <th class="numeric">均价</th>
                      <th class="numeric">当前价值</th>
                      <th class="numeric">累计参与</th>
                      <th>命中Top100</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${(rec.topHolders || []).slice(0, 25).map((holder) => `
                      <tr>
                        <td>#${escapeHtml(holder.holderRank)} ${escapeHtml(holder.userName)}<div class="source-detail">${escapeHtml(shortWallet(holder.proxyWallet))} · ${escapeHtml(holder.outcome || rec.name)}</div></td>
                        <td class="numeric">${fmtShares(holder.size)}</td>
                        <td class="numeric">${fmtPrice(holder.avgPrice)}</td>
                        <td class="numeric">${fmtMoney(holder.currentValue)}</td>
                        <td class="numeric">${fmtMoney(holder.totalBought)}</td>
                        <td>${holder.isElite ? `#${escapeHtml(holder.traderRank)} · 胜率 ${fmtPct(holder.winRateEstimate)} · PNL ${fmtMoney(holder.soccerPnl)}` : "否"}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </section>
            `).join("") : '<div class="empty">当前这些盘口暂未返回公开持仓。</div>'}
          </div>
        `;
      }

      function renderEliteSummaryChip(rec) {
        if (rec.eliteSummary?.count) return `<span class="elite-chip hot">高手 ${escapeHtml(rec.eliteSummary.count)}人 · ${fmtMoney(rec.eliteSummary.totalCurrentValue)}</span>`;
        if (rec.holderSummary?.count) return `<span class="elite-chip">${escapeHtml(rec.holderSummary.count)}持仓者 · ${fmtShares(rec.holderSummary.totalShares)}</span>`;
        return "";
      }

      function renderEliteRowDetails(rec) {
        const signals = rec.eliteSignals || [];
        const holders = rec.topHolders || [];
        if (!rec.eliteSummary?.count && !rec.holderSummary?.count) return '<div class="row-detail-panel"><div class="empty">当前这个盘口暂未返回公开持仓。</div></div>';
        return `
          <div class="row-detail-panel">
            <div class="row-detail-head">
              <div class="row-detail-title">${escapeHtml(rec.name)} · 顶级持仓者</div>
              <div class="row-detail-meta">持仓 ${escapeHtml(rec.holderSummary?.count || 0)} 人 · 份额 ${fmtShares(rec.holderSummary?.totalShares || 0)} · 高手 ${escapeHtml(rec.eliteSummary?.count || 0)} 人 · Top ${escapeHtml(rec.holderSummary?.topHolder || rec.eliteSummary?.topTrader || "-")}</div>
            </div>
            <div class="elite-inline-list">
              ${holders.slice(0, 20).map((holder) => `
                <div class="elite-inline-card">
                  <div class="elite-inline-head">
                    <span>#${escapeHtml(holder.holderRank)} ${escapeHtml(holder.userName)}</span>
                    <span>${fmtShares(holder.size)}</span>
                  </div>
                  <div class="elite-inline-meta">
                    钱包 ${escapeHtml(shortWallet(holder.proxyWallet))} · 方向 ${escapeHtml(holder.outcome || rec.name)} · 均价 ${fmtPrice(holder.avgPrice)} · 当前 ${fmtMoney(holder.currentValue)} · 累计参与 ${fmtMoney(holder.totalBought)}
                  </div>
                  <div class="elite-inline-meta">
                    ${holder.isElite ? `命中足球 Top100 #${escapeHtml(holder.traderRank)} · 胜率 ${fmtPct(holder.winRateEstimate)} · 足球PNL ${fmtMoney(holder.soccerPnl)} · 样本 ${escapeHtml(holder.soccerSettledPositions)}` : "未命中足球 Top100"}
                  </div>
                </div>
              `).join("")}
              ${signals.length ? `<div class="source-detail">足球 Top100 命中账号：${signals.slice(0, 12).map((signal) => `#${signal.traderRank} ${signal.userName}`).join("，")}</div>` : ""}
            </div>
          </div>
        `;
      }

      function renderMatch(match) {
        const rows = match.recommendations.map((rec, index) => {
          const detailId = `rec-detail-${escapeHtml(match.id)}-${index}`;
          const hasEliteSignals = Boolean(rec.eliteSummary?.count);
          const hasHolderSignals = Boolean(rec.holderSummary?.count);
          const hasExpandableSignals = hasEliteSignals || hasHolderSignals;
          return `
          <tr class="recommendation-main-row ${hasExpandableSignals ? "expandable" : ""}" data-detail-id="${detailId}" aria-expanded="false" ${hasExpandableSignals ? 'tabindex="0"' : ""}>
            <td>${escapeHtml(rec.marketTypeLabel || "-")}</td>
            <td>
              <span class="market-cell-main">
                ${hasExpandableSignals ? '<span class="elite-arrow" aria-hidden="true">›</span>' : ""}
                <span>${escapeHtml(rec.name)}</span>
                ${renderEliteSummaryChip(rec)}
              </span>
              ${rec.holderSummary?.count ? `<div class="decision-note">Top holder: ${escapeHtml(rec.holderSummary.topHolder || "-")} · 份额 ${fmtShares(rec.holderSummary.totalShares)}</div>` : ""}
            </td>
            <td class="numeric">${fmtPct(rec.modelProbability)}</td>
            <td class="numeric">${fmtPct(rec.pushProbability)}</td>
            <td class="numeric">${fmtPrice(rec.marketPrice)}</td>
            <td>${escapeHtml(fmtOdds(rec.odds))}</td>
            <td class="numeric">${fmtPct(rec.edge)}</td>
            <td class="numeric">${rec.decision?.gated ? "等待" : fmtPrice(rec.maxBuyPrice)}</td>
            <td class="chart-cell">
              <canvas class="sparkline market-sparkline" width="148" height="38" data-series="${encodeURIComponent(JSON.stringify(rec.chart?.history || []))}" aria-label="${escapeHtml(rec.name)} 价格曲线"></canvas>
              <div class="chart-source">${escapeHtml(rec.chart?.source || "无曲线")}</div>
            </td>
            <td>
              <span class="decision ${rec.decision.action}">${escapeHtml(rec.decision.label)}</span>
              ${rec.decision.reasons?.length ? `<div class="decision-note">${escapeHtml(rec.decision.reasons.join("；"))}</div>` : ""}
            </td>
          </tr>
          ${hasExpandableSignals ? `<tr class="recommendation-detail-row" id="${detailId}" hidden>
            <td class="row-detail-cell" colspan="10">${renderEliteRowDetails(rec)}</td>
          </tr>` : ""}
        `;
        }).join("");

        const staticItems = [
          [homeName(match), `世界排名：${formatWorldRanking(match.homeTeam)}`],
          [awayName(match), `世界排名：${formatWorldRanking(match.awayTeam)}`],
          ...match.homeTeam.staticSignals.map((signal) => [`${homeName(match)}`, signal]),
          ...match.awayTeam.staticSignals.map((signal) => [`${awayName(match)}`, signal])
        ];

        const watchItems = [
          ...match.homeTeam.watchItems.map((item) => [`${homeName(match)}`, item]),
          ...match.awayTeam.watchItems.map((item) => [`${awayName(match)}`, item])
        ];

        return `
          <article class="match-card" data-match="${escapeHtml(match.id)}">
            <div class="match-header">
              <div class="teams">
                <h3>${escapeHtml(homeName(match))} vs ${escapeHtml(awayName(match))}</h3>
                <div class="meta-line">${escapeHtml(match.group)} 组 · ${escapeHtml(match.venue)} · 北京时间 ${fmtTime(match.kickoffShanghai)}</div>
              </div>
              <span class="badge">${match.autoBaseline ? "赛程自动基线" : `第 ${escapeHtml(match.matchday)} 比赛日`}</span>
            </div>

            ${renderAiPrediction(match)}

            ${renderOddsBoard(match)}

            <div class="tabs" role="tablist">
              <button class="tab active" data-tab="rec">建议</button>
              <button class="tab" data-tab="intel">比赛情报</button>
              <button class="tab" data-tab="elite">高手</button>
              <button class="tab" data-tab="static">静态</button>
              <button class="tab" data-tab="dynamic">动态</button>
              <button class="tab" data-tab="market">盘口</button>
            </div>

            <div class="tab-content active" data-content="rec">
              <div class="recommendations">
                <table>
                  <thead>
                    <tr>
                      <th>类型</th>
                      <th>市场</th>
                      <th class="numeric">模型</th>
                      <th class="numeric">走水</th>
                      <th class="numeric">盘口</th>
                      <th>传统赔率</th>
                      <th class="numeric">Edge</th>
                      <th class="numeric">建议买价≤</th>
                      <th>曲线</th>
                      <th>动作</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>

            <div class="tab-content" data-content="intel">
              ${renderMatchIntel(match)}
            </div>

            <div class="tab-content" data-content="elite">
              ${renderEliteSignals(match)}
            </div>

            <div class="tab-content" data-content="static">
              ${renderStaticInfo(match, staticItems)}
            </div>

            <div class="tab-content" data-content="dynamic">
              <ul class="info-list">
                <li><strong>状态</strong><span>${escapeHtml(match.dynamic.status)}</span></li>
                <li><strong>伤病</strong><span>${escapeHtml(match.dynamic.injurySummary)}</span></li>
                <li><strong>天气</strong><span>${escapeHtml(match.dynamic.weatherSummary)}</span></li>
                <li><strong>首发信心</strong><span>${escapeHtml(match.dynamic.lineupConfidence)}</span></li>
                ${watchItems.map(([team, item]) => `<li><strong>${escapeHtml(team)}</strong><span>${escapeHtml(item)}</span></li>`).join("")}
              </ul>
            </div>

            <div class="tab-content" data-content="market">
              <ul class="info-list">
                ${match.autoBaseline ? '<li><strong>基线状态</strong><span>已纳入三天赛程窗口，并用保守球队评分生成基础概率；缺少真实盘口或动态情报时，只显示观察，不给价格建议。</span></li>' : ""}
                ${match.scheduleStatusDetail || match.scheduleStatus ? `<li><strong>比赛状态</strong><span>${escapeHtml(match.scheduleStatusDetail || match.scheduleStatus)}</span></li>` : ""}
                ${match.scheduleSource ? `<li><strong>赛程来源</strong><span>${escapeHtml(match.scheduleSource)}</span></li>` : ""}
                <li><strong>盘口来源</strong><span>${escapeHtml(match.manualMarkets.source)}</span></li>
                <li><strong>盘口更新时间</strong><span>${fmtTime(match.manualMarkets.lastUpdated)}</span></li>
                <li><strong>胜平负</strong><span>${escapeHtml(homeName(match))} ${fmtPrice(match.manualMarkets.moneyline?.home)} / 平局 ${fmtPrice(match.manualMarkets.moneyline?.draw)} / ${escapeHtml(awayName(match))} ${fmtPrice(match.manualMarkets.moneyline?.away)}</span></li>
                <li><strong>大小球</strong><span>小于 2.5 球 ${fmtPrice(match.manualMarkets.totals?.under25)} / 大于 2.5 球 ${fmtPrice(match.manualMarkets.totals?.over25)}</span></li>
                <li><strong>模型 xG</strong><span>${match.model.lambdaHome.toFixed(2)} - ${match.model.lambdaAway.toFixed(2)}</span></li>
                <li><strong>常见比分</strong><span>${match.probabilities.topScores.map((s) => `${s.score} ${(s.probability * 100).toFixed(1)}%`).join(", ")}</span></li>
                ${(match.recommendations || []).filter((rec) => rec.marketType === "handicap").map((rec) => `<li><strong>让球盘</strong><span>${escapeHtml(rec.name)} @ ${fmtPrice(rec.marketPrice)} · ${escapeHtml(fmtOdds(rec.odds))} · 模型 ${fmtPct(rec.modelProbability)}</span></li>`).join("")}
                ${match.model.manualAdjustments.map((adj) => `<li><strong>${escapeHtml(adj.label)}</strong><span>${escapeHtml(adj.impact)}</span></li>`).join("")}
              </ul>
            </div>
          </article>
        `;
      }

      function renderMatchTabs(matches) {
        if (!matches.length) {
          return '<div class="empty">三天窗口内没有未结束比赛。</div>';
        }
        const tabs = matches.map((match, index) => `
          <button class="match-tab ${index === 0 ? "active" : ""}" data-match-tab="${escapeHtml(match.id)}" type="button">
            <span class="match-tab-title">${escapeHtml(homeName(match))} vs ${escapeHtml(awayName(match))}</span>
            <span class="match-tab-meta">${match.autoBaseline ? "自动基线 · " : `${escapeHtml(match.group)} 组 · `}${fmtTime(match.kickoffShanghai)}</span>
          </button>
        `).join("");

        const panels = matches.map((match, index) => `
          <div class="match-panel ${index === 0 ? "active" : ""}" data-match-panel="${escapeHtml(match.id)}">
            ${renderMatch(match)}
          </div>
        `).join("");

        return `
          <div class="match-switcher" role="tablist" aria-label="比赛切换">
            ${tabs}
          </div>
          <div class="match-panels">
            ${panels}
          </div>
        `;
      }

      function wireMatchTabs() {
        const root = document.getElementById("matches");
        root.querySelectorAll(".match-tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            const id = tab.dataset.matchTab;
            root.querySelectorAll(".match-tab").forEach((item) => item.classList.toggle("active", item === tab));
            root.querySelectorAll(".match-panel").forEach((panel) => {
              panel.classList.toggle("active", panel.dataset.matchPanel === id);
            });
            drawBigCharts(root);
          });
        });
      }

      function wireTabs() {
        document.querySelectorAll(".match-card").forEach((card) => {
          card.querySelectorAll(".tab").forEach((tab) => {
            tab.addEventListener("click", () => {
              const target = tab.dataset.tab;
              card.querySelectorAll(".tab").forEach((item) => item.classList.toggle("active", item === tab));
              card.querySelectorAll(".tab-content").forEach((content) => {
                content.classList.toggle("active", content.dataset.content === target);
              });
            });
          });
        });
      }

      function wireOddsTabs() {
        document.querySelectorAll(".odds-board").forEach((board) => {
          board.querySelectorAll(".odds-board-tab").forEach((tab) => {
            tab.addEventListener("click", () => {
              const target = tab.dataset.oddsTab;
              board.querySelectorAll(".odds-board-tab").forEach((item) => item.classList.toggle("active", item === tab));
              board.querySelectorAll(".odds-board-panel").forEach((panel) => {
                panel.classList.toggle("active", panel.dataset.oddsPanel === target);
              });
              drawBigCharts(board);
            });
          });
        });
      }

      function wireRecommendationRows() {
        document.querySelectorAll(".recommendation-main-row.expandable").forEach((row) => {
          const toggle = () => {
            const detail = document.getElementById(row.dataset.detailId);
            if (!detail) return;
            const open = row.getAttribute("aria-expanded") === "true";
            row.setAttribute("aria-expanded", open ? "false" : "true");
            row.classList.toggle("expanded", !open);
            detail.hidden = open;
            if (!open) drawSparklines(detail);
          };
          row.addEventListener("click", (event) => {
            if (event.target.closest("a, button, canvas")) return;
            toggle();
          });
          row.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            toggle();
          });
        });
      }

      function renderDashboard(data) {
        currentDashboard = data;
        applyLanguageStatic();
        document.getElementById("subhead").textContent = currentLang === "en"
          ? `${data.meta.tournament} · ${data.meta.timezone}`
          : `${data.meta.tournament} · ${data.meta.timezone}`;
        document.getElementById("lastUpdate").textContent = currentLang === "en"
          ? `Generated ${fmtTime(data.meta.generatedAt)} · Intelligence ${fmtTime(data.contextMeta?.lastUpdated)} · Local baseline ${fmtTime(data.meta.lastManualUpdate)}`
          : `生成 ${fmtTime(data.meta.generatedAt)} · 情报 ${fmtTime(data.contextMeta?.lastUpdated)} · 本地基线 ${fmtTime(data.meta.lastManualUpdate)}`;
        renderSources(data.sources);
        renderPolymarket(data.polymarket);
        renderEliteTradersPanel(data.eliteTraders);
        document.getElementById("matches").innerHTML = renderMatchTabs(data.matches);
        translateRenderedContent(document.body);
        wireMatchTabs();
        wireTabs();
        wireOddsTabs();
        wireRecommendationRows();
        drawSparklines(document.getElementById("matches"));
        drawBigCharts(document.getElementById("matches"));
      }

      async function loadDashboard(force = false) {
        const button = document.getElementById("refresh");
        button.disabled = true;
        try {
          if (window.location.protocol === "file:") {
            throw new Error("当前是 file:// 打开的静态文件，请通过 Node 服务或远端 /worldcup/ 访问页面，否则 API 数据无法加载。");
          }
          const basePath = window.location.pathname.endsWith("/")
            ? window.location.pathname
            : window.location.pathname.replace(/\/[^/]*$/, "/");
          const apiPath = `${basePath}api/dashboard${force ? "?force=1" : ""}`;
          const response = await fetch(apiPath, { cache: "no-store" });
          const data = await response.json();
          window.dashboardResearchFramework = data.researchFramework || {};
          renderDashboard(data);
        } catch (error) {
          const message = currentLang === "en" ? `Load failed: ${error.message}` : `加载失败：${error.message}`;
          document.getElementById("matches").innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        } finally {
          button.disabled = false;
        }
      }

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });
      document.getElementById("refresh").addEventListener("click", () => loadDashboard(true));
      applyLanguageStatic();
      loadDashboard();
      setInterval(() => loadDashboard(true), 5 * 60 * 1000);
    </script>
  </body>
</html>
